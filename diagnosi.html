<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Via Libera · diagnosi</title>
<style>
:root { --ink: #111; }
body { font: 15px/1.4 sans-serif; margin: 12px; background: #fff; color: #000; }
td { border-bottom: 1px solid #000; padding: 4px 6px; vertical-align: top; }
#v { color: #fff; }
#v { background: var(--ink); }
#f { display: -webkit-box; display: flex; }
#f span { border: 1px solid #000; padding: 2px 6px; }
canvas { border: 1px solid #000; }
</style></head><body>
<h3>Diagnosi del browser</h3>
<p>Fai una foto a questa pagina.</p>
<table id="t"></table>
<p id="v">Se questa riga è nera con testo bianco, le variabili CSS funzionano.</p>
<div id="f"><span>uno</span><span>due</span><span>tre</span></div>
<p>(sopra: se “uno due tre” sono in fila, flex funziona)</p>
<p>Tela 240×150 ingrandita ×2 con drawImage:</p><canvas id="c1" width="240" height="150"></canvas>
<p>Stessa, scritta punto per punto:</p><canvas id="c2" width="240" height="150"></canvas>
<script>
var rows = [];
function add(k, v) { rows.push("<tr><td><b>" + k + "</b></td><td>" + v + "</td></tr>"); }
add("Browser", navigator.userAgent);
add("Finestra", window.innerWidth + " × " + window.innerHeight + ", densità " + (window.devicePixelRatio || 1));
add("Schermo", screen.width + " × " + screen.height);
var ls = "no"; try { localStorage.setItem("x", "1"); ls = localStorage.getItem("x") === "1" ? "sì" : "no"; } catch (e) { ls = "errore: " + e; }
add("localStorage", ls);
var v = document.getElementById("v"), bg = window.getComputedStyle(v).backgroundColor;
add("Variabili CSS", bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent" ? "sì (" + bg + ")" : "no");
add("flex", window.getComputedStyle(document.getElementById("f")).display);
add("canvas", !!document.createElement("canvas").getContext ? "sì" : "no");
add("matchMedia", !!window.matchMedia ? "sì" : "no");
function pattern(ctx, w, h, k) {
  var img = ctx.createImageData(w, h), d = img.data, x, y, i, on;
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
    on = ((Math.floor(x / (8 * k)) + Math.floor(y / (8 * k))) % 2) === 0 || (x % (16 * k) < k);
    i = (y * w + x) * 4; d[i] = d[i + 1] = d[i + 2] = on ? 17 : 241; d[i + 3] = 255;
  }
  return img;
}
try {
  var src = document.createElement("canvas"); src.width = 120; src.height = 75;
  src.getContext("2d").putImageData(pattern(src.getContext("2d"), 120, 75, 1), 0, 0);
  var c1 = document.getElementById("c1").getContext("2d"); c1.imageSmoothingEnabled = false; c1.webkitImageSmoothingEnabled = false;
  c1.drawImage(src, 0, 0, 240, 150);
  var c2 = document.getElementById("c2").getContext("2d"); c2.putImageData(pattern(c2, 240, 150, 2), 0, 0);
  add("Tele", "disegnate");
} catch (e) { add("Tele", "errore: " + e); }
document.getElementById("t").innerHTML = rows.join("");
</script></body></html>
