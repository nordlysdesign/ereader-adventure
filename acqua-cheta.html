<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acqua Cheta</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
/* Layout: una scrivania grigia con sopra un e-reader. Dentro lo schermo solo carta e inchiostro:
   prologo e titoli dei capitoli sono impaginati come un romanzo, il gioco come un terminale.
   Tema unico per scelta: e' la resa di un pannello e-ink. */
:root {
  color-scheme: light;
  --desk: #c7cbc9;
  --desk-ink: #23282a;
  --bezel: #1d2022;
  --paper: #f1f0ea;
  --ink: #111111;
  --ink-soft: #565a5b;
  --mono: "IBM Plex Mono", "Courier New", Courier, monospace;
  --serif: "Old Standard TT", "Century Schoolbook", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #c7cbc9; color: #23282a; font-family: "IBM Plex Mono", "Courier New", Courier, monospace; font-size: 14.5px; line-height: 1.5; }

.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }

.demo-bar { width: 100%; max-width: 600px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.demo-bar h1 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-weight: 700; font-size: 27px; line-height: 1; margin: 0; letter-spacing: 3px; text-transform: uppercase; }
.demo-bar p { margin: 4px 0 0; font-size: 12px; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.seg { display: flex; }
.seg button { font: 600 12px/1 "IBM Plex Mono", "Courier New", Courier, monospace; color: #23282a; background: transparent; border: 2px solid #23282a; padding: 0 10px; min-height: 32px; cursor: pointer; border-radius: 0; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: #23282a; color: #c7cbc9; }

.device { flex: 1 1 auto; width: 100%; max-width: 600px; min-height: 600px; max-height: 900px; display: flex; background: #1d2022; padding: 22px 22px 40px; border-radius: 18px; }
.screen { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #f1f0ea; color: #111111; }

.status { display: flex; justify-content: space-between; gap: 12px; background: #111111; color: #f1f0ea; font-weight: 600; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 16px; }
.status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- pagina ---------- */
.out { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 14px 16px 6px; }
.out p { margin: 0 0 10px; max-width: 64ch; }
.out .room { font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; }
.out .echo { font-weight: 600; margin: 0 0 8px; }
.out .note { color: #565a5b; font-size: 13px; }
.out .turn + .turn { border-top: 1px dashed #111111; padding-top: 12px; margin-top: 6px; }
.kw { font-weight: 600; border-bottom: 2px dotted #111111; cursor: pointer; }

.front { text-align: center; margin: 2px 0 10px; }
.front h2 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 30px; letter-spacing: 5px; text-transform: uppercase; margin: 0; line-height: 1.1; text-wrap: balance; }
.front span { display: block; font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-style: italic; font-size: 15px; margin-top: 2px; }
.prosa p { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 17.5px; line-height: 1.46; max-width: 60ch; margin: 0 0 9px; }
.prosa p:first-child::first-letter { float: left; font-weight: 700; font-size: 3.05em; line-height: 0.86; padding: 3px 7px 0 0; }

figure { margin: 2px 0 12px; }
figure canvas { display: block; margin: 0 auto; border: 2px solid #111111; max-width: 100%; }
figcaption { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-style: italic; font-size: 14px; text-align: center; margin-top: 5px; }

.sheet { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: flex-start; margin-bottom: 8px; }
.sheet figure { flex: 0 0 auto; margin: 0; }
.sheet figure canvas { border: 0; }
.sheet figcaption { max-width: 124px; font-size: 12.5px; line-height: 1.25; }
.sheet .who { flex: 1 1 240px; min-width: 0; }
.sheet h2 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 6px; line-height: 1.1; border-bottom: 2px solid #111111; padding-bottom: 4px; }
.sheet dl { margin: 0; font-size: 13px; line-height: 1.4; }
.sheet dt { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin-top: 6px; }
.sheet dd { margin: 0; }
.facts { margin: 0 0 8px; padding: 8px 0 0 18px; border-top: 1px solid #111111; font-size: 13px; }
.facts-title { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin: 0 0 -4px; }
.end { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-style: italic; font-size: 20px; text-align: center; border-top: 2px solid #111111; border-bottom: 2px solid #111111; padding: 8px 0; margin: 14px 0 10px; }
.turn-next { display: block; width: 100%; margin: 6px 0 8px; }

/* ---------- comandi ---------- */
.chip { font: 600 12.5px/1 "IBM Plex Mono", "Courier New", Courier, monospace; color: #111111; background: #f1f0ea; border: 2px solid #111111; border-radius: 0; padding: 0 8px; min-width: 38px; min-height: 36px; cursor: pointer; }
.chip.on { background: #111111; color: #f1f0ea; }
.chip:disabled { border-style: dotted; color: #565a5b; cursor: default; }
.chip.go { min-height: 42px; font-size: 14px; }

.book { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 16px; border-top: 2px solid #111111; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager span { font-size: 12px; min-width: 88px; text-align: center; }
.refs { display: flex; gap: 6px; }
.screen.rullo .pager { visibility: hidden; }

.rows { display: grid; grid-template-columns: 58px 1fr; gap: 6px 8px; align-items: center; padding: 0 16px; }
.rows .lab { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #565a5b; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; }
.chips .spacer { flex: 1 1 auto; }
.bag { font-size: 13.5px; line-height: 1.9; }
.bag .sep { padding: 0 7px; color: #565a5b; }

.cmd { display: flex; align-items: center; gap: 8px; padding: 6px 16px 14px; }
.cmd label { font-weight: 600; font-size: 18px; }
.cmd input { flex: 1 1 auto; min-width: 0; font: 400 16px/1.2 "IBM Plex Mono", "Courier New", Courier, monospace; color: #111111; background: #f1f0ea; border: 0; border-bottom: 2px solid #111111; border-radius: 0; padding: 6px 2px; }
.cmd input::placeholder { color: #565a5b; }
.screen.reading .rows, .screen.reading .cmd { display: none; }
.screen.reading .book { padding-bottom: 14px; }

button:focus-visible, input:focus-visible, .kw:focus-visible { outline: 3px solid #111111; outline-offset: 2px; }
.seg button:focus-visible { outline-color: #23282a; }

.foot { width: 100%; max-width: 600px; margin: 0; font-size: 12px; }

@media (max-width: 640px) {
  .stage { padding: 0; gap: 0; }
  .demo-bar { padding: 10px 16px; }
  .demo-bar h1 { font-size: 22px; }
  .device { padding: 0; border-radius: 0; max-height: none; min-height: 560px; }
  .foot { padding: 8px 16px; }
  .rows { grid-template-columns: 1fr; gap: 2px; }
  .rows .lab { margin-top: 4px; }
}

/* ---------- terza prova ---------- */
.switches { display: flex; flex-wrap: wrap; gap: 8px 16px; }
figure canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.sheet figure canvas { border: 2px solid #111111; }
.chapter { text-align: center; border-top: 2px solid #111111; border-bottom: 2px solid #111111; padding: 10px 0 12px; margin: 4px 0 14px; }
.chapter span { display: block; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
.chapter h2 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 27px; font-style: italic; font-weight: 400; margin: 2px 0 0; line-height: 1.15; text-wrap: balance; }
.out .code { font-size: 19px; font-weight: 600; letter-spacing: 2px; border: 2px solid #111111; padding: 10px 12px; text-align: center; word-break: break-all; max-width: none; }
.people { margin: 0 0 8px; padding-top: 6px; border-top: 1px solid #111111; font-size: 13px; line-height: 1.4; }
.people dt { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin-top: 6px; }
.people dd { margin: 0; }
.facts { list-style: square; }
/* impostazioni: un pannello dentro lo schermo, aperto dal pulsante Aa */
.book { flex-wrap: wrap; }
.screen.rullo .pager { display: none; }
.screen.rullo .book { justify-content: flex-end; }
.prefs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 16px 10px; border-top: 2px solid #111111; }
.prefs.off { display: none; }
.prefs .switch { color: #111111; }
.prefs .seg button { color: #111111; border-color: #111111; background: #f1f0ea; }
.prefs .seg button[aria-pressed="true"] { background: #111111; color: #f1f0ea; }
.prefs .seg button:focus-visible { outline-color: #111111; }
.prefs .restart .chip { margin-left: 6px; }
.prefs-note { width: 100%; margin: 0; font-size: 12px; color: #565a5b; }
/* cassetto: di base resta solo la riga di comando, il resto si apre con COMANDI */
.drawer.off { display: none; }
.drawer { border-top: 2px solid #111111; padding-bottom: 8px; }
.drawer .book { border-top: 0; }
.cmd { border-top: 2px solid #111111; padding-top: 8px; }
.screen.reading .drawer.off { display: block; }
.screen.reading .drawer .rows, .screen.reading .drawer .refs { display: none; }
/* dimensione del testo, scelta in Aa */
.screen.t2 .out { font-size: 17px; } .screen.t2 .out .note { font-size: 15px; } .screen.t2 .prosa p { font-size: 20px; }
.screen.t3 .out { font-size: 20px; } .screen.t3 .out .note { font-size: 17px; } .screen.t3 .prosa p { font-size: 23px; }
@media (max-width: 640px) { .stage { min-height: 100%; } .device { min-height: 100%; } }
/* elenco delle storie */
.home .out { padding-bottom: 20px; }
.story { border-top: 2px solid #111111; padding: 14px 0 6px; }
.story img { display: block; margin: 0 auto 8px; border: 2px solid #111111; width: 100%; max-width: 480px; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.story h3 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 26px; font-style: italic; font-weight: 400; margin: 0; line-height: 1.15; }
.story .where { display: block; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 2px; }
.story p { margin: 6px 0 8px; }
.story .state { font-size: 13px; color: #565a5b; }
.story .mode { border-top: 1px dashed #111111; padding-top: 8px; margin-top: 4px; }
.story .mode .how { margin: 0 0 4px; font-size: 13px; }
.story .mode .state:empty { display: none; }
.story .go a, .story .go button { display: inline-block; text-decoration: none; line-height: 38px; min-height: 42px; margin: 0 8px 8px 0; padding: 0 14px; font-size: 14px; }
.story .go a.main { background: #111111; color: #f1f0ea; }
</style>
</head>
<body>
<main class="stage">
  <div class="device">
    <div class="screen" id="screen">
      <div class="status"><span id="st-room">Prologo</span><span id="st-moves">Cap. 1 · Mosse 0</span></div>
      <div class="out" id="out" aria-live="polite"></div>

      <div class="drawer off" id="drawer">
      <div class="book">
        <div class="pager">
          <button type="button" class="chip" id="pg-prev" aria-label="Pagina precedente">◀</button>
          <span id="pg-label">Pag. 1 di 1</span>
          <button type="button" class="chip" id="pg-next" aria-label="Pagina successiva">▶</button>
        </div>
        <div class="refs">
          <button type="button" class="chip" id="ref-scheda" data-cmd="scheda">SCHEDA</button>
          <button type="button" class="chip" id="ref-mappa" data-cmd="mappa">MAPPA</button>
          <button type="button" class="chip" id="ref-salva" data-cmd="salva">SALVA</button>
          <button type="button" class="chip" id="ref-indizio" data-cmd="indizio">INDIZIO</button>
          <button type="button" class="chip" id="ref-aiuto" data-cmd="aiuto" aria-label="Aiuto">?</button>
          <button type="button" class="chip" id="ref-prefs" aria-label="Impostazioni" aria-expanded="false" aria-controls="prefs">Aa</button>
        </div>
      </div>

      <div class="prefs off" id="prefs">
        <div class="switch"><span id="lbl-mode">Schermo</span>
          <div class="seg" role="group" aria-labelledby="lbl-mode">
            <button type="button" id="mode-rullo" aria-pressed="true">Rullo</button>
            <button type="button" id="mode-pagina" aria-pressed="false">Pagina</button>
          </div>
        </div>
        <div class="switch"><span id="lbl-mot">Movimento</span>
          <div class="seg" role="group" aria-labelledby="lbl-mot">
            <button type="button" id="mot-on" aria-pressed="true">Sì</button>
            <button type="button" id="mot-off" aria-pressed="false">No</button>
          </div>
        </div>
        <div class="switch"><span id="lbl-size">Testo</span>
          <div class="seg" role="group" aria-labelledby="lbl-size">
            <button type="button" id="size-1" aria-pressed="true" aria-label="Testo normale">A</button>
            <button type="button" id="size-2" aria-pressed="false" aria-label="Testo grande">A+</button>
            <button type="button" id="size-3" aria-pressed="false" aria-label="Testo molto grande">A++</button>
          </div>
        </div>
        <div class="switch restart"><span>Ricomincia</span>
          <button type="button" class="chip" id="re-cap">Capitolo</button>
          <button type="button" class="chip" id="re-all">Da capo</button>
        </div>
        <div class="switch restart"><span>Storie</span>
          <button type="button" class="chip" id="go-home">Cambia storia</button>
        </div>
        <p class="prefs-note">Su e-ink il movimento lascia aloni: lì conviene spegnerlo.</p>
      </div>

      <div class="rows" id="rows">
        <span class="lab">Rotta</span>
        <div class="chips" id="chips-dir"></div>
        <span class="lab">Azioni</span>
        <div class="chips" id="chips-verb">
          <button type="button" class="chip" id="v-esamina" data-verb="esamina">ESAMINA</button>
          <button type="button" class="chip" id="v-prendi" data-verb="prendi">PRENDI</button>
          <button type="button" class="chip" id="v-apri" data-verb="apri">APRI</button>
          <button type="button" class="chip" id="v-usa" data-verb="usa">USA</button>
          <button type="button" class="chip" id="v-dai" data-verb="dai">DAI</button>
          <button type="button" class="chip" id="v-parla" data-verb="parla">PARLA</button>
        </div>
        <span class="lab">Con te</span>
        <div class="bag" id="bag"></div>
      </div>

      </div>

      <form class="cmd" id="cmd-form" autocomplete="off">
        <label for="cmd-input">&gt;</label>
        <input id="cmd-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="scrivi un comando">
        <button type="button" class="chip" id="drawer-btn" aria-expanded="false" aria-controls="drawer">COMANDI</button>
      </form>
    </div>
  </div>

</main>

<script>
/* ==================================================================
   LIBRERIA DI DISEGNO, comune a tutte le storie. 240x150 punti, solo
   bianco e nero: forme piene, sagome con il filo intorno, tratti,
   scritte a pixel. Le scene stanno nei file pix di ogni storia e si
   registrano con Pix.add(), Pix.addObjects() e Pix.setMap().
   ================================================================== */
var Pix = (function () {
  var W = 240, H = 150, PI = Math.PI;
  var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

  /* tono: 0 bianco ... 16 nero (retino ordinato), oppure una trama con nome */
  function tone(t, x, y) {
    if (typeof t === "number") { return t <= 0 ? 0 : (t >= 16 ? 1 : (BAY[(y & 3) * 4 + (x & 3)] < t ? 1 : 0)); }
    switch (t) {
      case "h": return y & 1;
      case "h3": return y % 3 === 0 ? 1 : 0;
      case "v": return x & 1;
      case "v3": return x % 3 === 0 ? 1 : 0;
      case "d": return (x + y) % 4 === 0 ? 1 : 0;
      case "D": return (x + y) % 4 === 0 ? 0 : 1;
      case "e": return (x - y + 400) % 4 === 0 ? 1 : 0;
      case "brick": return (y % 7 === 0 || ((x + (Math.floor(y / 7) % 2) * 7) % 14 === 0)) ? 0 : 1;
      case "stone": return (y % 8 === 0 || ((x + (Math.floor(y / 8) % 2) * 9) % 18 === 0)) ? 1 : 0;
      case "dot": return (x % 4 === 0 && y % 4 === 0) ? 1 : 0;
      case "wdot": return (x % 4 === 2 && y % 4 === 2) ? 0 : 1;
    }
    return 0;
  }
  function h1(i) { var v = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return v - Math.floor(v); }

  /* ---------- tela ---------- */
  function Gfx(w, h) { this.w = w; this.h = h; this.d = []; this.m = null; this.c = null; for (var i = 0; i < w * h; i++) { this.d[i] = 0; } }
  var G = Gfx.prototype;
  G.set = function (x, y, v) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) { return; }
    if (this.c && (x < this.c[0] || x > this.c[2] || y < this.c[1] || y > this.c[3])) { return; }
    this.d[y * this.w + x] = v; if (this.m) { this.m[y * this.w + x] = 1; }
  };
  G.px = function (x, y, t) { x = Math.round(x); y = Math.round(y); this.set(x, y, tone(t, x, y)); };
  G.flip = function (x, y) { if (x >= 0 && y >= 0 && x < this.w && y < this.h && !(this.c && (x < this.c[0] || x > this.c[2] || y < this.c[1] || y > this.c[3]))) { this.d[y * this.w + x] = 1 - this.d[y * this.w + x]; } };
  G.hline = function (x0, x1, y, t) { x0 = Math.round(x0); x1 = Math.round(x1); y = Math.round(y); for (var x = x0; x <= x1; x++) { this.set(x, y, tone(t, x, y)); } };
  G.vline = function (x, y0, y1, t) { x = Math.round(x); y0 = Math.round(y0); y1 = Math.round(y1); for (var y = y0; y <= y1; y++) { this.set(x, y, tone(t, x, y)); } };
  G.rect = function (x0, y0, x1, y1, t) { y0 = Math.round(y0); y1 = Math.round(y1); for (var y = y0; y <= y1; y++) { this.hline(x0, x1, y, t); } };
  G.frame = function (x0, y0, x1, y1, t) { this.hline(x0, x1, y0, t); this.hline(x0, x1, y1, t); this.vline(x0, y0, y1, t); this.vline(x1, y0, y1, t); };
  G.line = function (x0, y0, x1, y1, t, th) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy, e2, n = 0;
    while (n++ < 2000) {
      this.set(x0, y0, tone(t, x0, y0));
      if (th) { this.set(x0 + 1, y0, tone(t, x0 + 1, y0)); this.set(x0, y0 + 1, tone(t, x0, y0 + 1)); }
      if (x0 === x1 && y0 === y1) { break; }
      e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; }
    }
  };
  G.pline = function (p, t, th) { for (var i = 0; i < p.length - 1; i++) { this.line(p[i][0], p[i][1], p[i + 1][0], p[i + 1][1], t, th); } };
  G.ell = function (cx, cy, rx, ry, t) {
    var y, hw;
    for (y = -Math.floor(ry); y <= Math.floor(ry); y++) { hw = rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))); this.hline(Math.round(cx - hw), Math.round(cx + hw), Math.round(cy + y), t); }
  };
  G.arc = function (cx, cy, rx, ry, a0, a1, t) {
    var n = Math.ceil(Math.abs(a1 - a0) * Math.max(rx, ry) * 1.6) + 2, i, a;
    for (i = 0; i <= n; i++) { a = a0 + (a1 - a0) * i / n; this.px(cx + rx * Math.cos(a), cy + ry * Math.sin(a), t); }
  };
  G.ring = function (cx, cy, rx, ry, t) { this.arc(cx, cy, rx, ry, 0, 2 * PI, t); };
  G.poly = function (p, t) {
    var minY = 1e9, maxY = -1e9, i, j, y, xs, a, b, x;
    for (i = 0; i < p.length; i++) { if (p[i][1] < minY) { minY = p[i][1]; } if (p[i][1] > maxY) { maxY = p[i][1]; } }
    for (y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      xs = [];
      for (i = 0, j = p.length - 1; i < p.length; j = i++) {
        a = p[i]; b = p[j];
        if ((a[1] <= y + 0.5 && b[1] > y + 0.5) || (b[1] <= y + 0.5 && a[1] > y + 0.5)) { xs.push(a[0] + (y + 0.5 - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }

      if (withImage) { b.push(IMG("direzione", "Direzione lavori")); }
      d = "Parquet, termosifoni, odore di cera: la Società scalda meglio del paese. Sotto una campana di vetro c'è il [[plastico]] della diga; alla parete una [[fotografia]] con molte autorità. ";
      d += c === 3 ? "L'ingegner [[Morandin]] è alla finestra e guarda il lago salire come altri guardano crescere un figlio. Sulla scrivania, sempre lo stesso [[fascicolo]]." : "L'ingegner [[Morandin]] ha una scrivania sgombra, un [[fascicolo]] solo, e i modi di chi non ha mai dovuto alzare la voce.";
      d += "\nLa strada è a [[ovest]].";
    } else if (r === "baracca") {
      if (withImage) { b.push(IMG("baracca", "Dove lavorava Malan")); }
      d = "Quattro pareti di abete e una [[stufa]] fredda. Qualcuno ha cercato in fretta: un [[cassetto]] ha la serratura scheggiata. Alla parete, [[carte]] del versante e una [[lavagna]] con due colonne di numeri; un [[calendario]]; in un angolo un [[sismografo]] che continua a girare per conto suo.";
      if (S.loc.occhiali === "baracca") { d += " Sul tavolo, una custodia da [[occhiali]]."; }
      d += "\nIl sentiero scende: [[giù]].";
    } else if (r === "diga") {
      if (withImage) { b.push(c === 4 ? IMG("digaNotte", "La notte del collaudo") : IMG("diga", "Centosessanta metri, visti da sopra")); }
      if (f.offerta) {
        d = "Il coronamento, al tramonto. [[Morandin]] è fermo in mezzo, tra te e la strada; due passi indietro l'[[avvocato]], e più in là un'[[automobile]] nera. Bepi ha chiuso la porta del casello. Il [[lago]] da una parte, il vuoto dall'altra.\n[[ACCETTA|accetta]], [[RIFIUTA|rifiuta]], oppure passa oltre: [[sud]].";
        b.push(P(d)); return b;
      }
      if (c === 4) {
        d = "I riflettori del collaudo fanno del coronamento un palcoscenico. Tre [[signori]] in cappotto controllano l'[[asta]] idrometrica ogni dieci minuti; l'ingegner [[Morandin]] non la guarda mai: sa già cosa dice. Un'[[automobile]] nera, col motore acceso per il riscaldamento. [[Bepi]] è nel casello, accanto ai volantini degli [[scarichi]], con la luce spenta. Il [[lago]] è a due spanne dal segno.";
      } else {
        d = "Duecento metri di coronamento, larghi come una strada. Da una parte il [[lago]], a un braccio; dall'altra il vuoto: centosessanta metri di calcestruzzo, e poi la gola. Un [[parapetto]] da tutte e due le parti. Sulla spalla della diga, il casello del guardiano: [[Bepi]] Tormen è sulla porta, con le mani in tasca. Dentro si vedono un [[orologio]] di ronda e i volantini degli [[scarichi]]. Sul paramento, dalla parte del lago, l'[[asta]] idrometrica.";
      }
      d += " In fondo, nella roccia, un [[portello]] di ferro" + (f.portello ? ", aperto su una scala: [[giù]]." : ".");
      d += "\nLa strada torna a [[sud]].";
    } else if (r === "cunicolo") {
      if (withImage) { b.push(IMG("cunicolo", "Dentro la spalla sinistra")); }
      d = "Sessanta gradini di ferro, poi una galleria alta quanto te, che entra nella montagna. La lampada fa un cerchio bianco, e basta. L'acqua cola dalla volta con la pazienza dei creditori. Lungo le crepe, una fila di [[spie]] di vetro. In fondo, nella sua cassetta, il [[pendolo]].";
      if (f.pendolo) { d += !f.tubo ? " Dietro la cassetta, tra l'asse e la roccia, il [[tubo]] di cartone." : (S.loc.relazione === "tubo" ? " Il [[tubo]] è aperto: dentro, la [[relazione]]." : " Il [[tubo]] è vuoto."); }
      d += "\nLa scala risale: [[su]].";
    } else if (r === "centralino") {
      if (withImage) { b.push(IMG("centralino", "Il quadro di Pieve Sorda")); }
      d = "Uno stanzino senza finestra, una sedia girevole, un [[quadro]] di noce con venti prese e quattro targhette che contano. Sopra il quadro una [[pendola]] che fa più rumore del necessario: mancano pochi minuti a mezzanotte. Olga è rimasta sulla porta, di spalle. ";
      d += f.cuffia ? "Hai la cuffia in testa. Le spine sono quattro: " + SPINE + "." : "La [[cuffia]] è appesa al suo gancio.";
      d += "\nLa sala è a [[ovest]].";
    }
    b.push(P(d));
    return b;
  }

  function prologue() {
    return [
      [{ t: "front", s: "Acqua Cheta", sub: "Un noir in quattro capitoli" },
        IMG("fermata", "Val Sorda, febbraio 1957"),
        { t: "prosa", s: "Val Sorda, Prealpi venete. In cima alla valle c'è una diga nuova, la più alta d'Europa, dicono i manifesti; sotto la diga un lago che sale; sopra il lago un paese che ha imparato a non fare domande.\n\nArrivi con l'ultima corriera, sotto una neve vecchia di tre giorni. Ti chiami Ada Corvi, hai quarantaquattro anni e una lettera d'incarico delle Assicurazioni «La Vigile» che dice «perito liquidatore». Stavolta è vero. Di Porto Scuro non parli: com'è finita, lo sai tu." }],
      [IMG("digaMorto", "Il coronamento, la notte dell'8 febbraio"),
        { t: "prosa", s: "Quattro giorni fa il geologo della Società, Ettore Malan, è caduto dal coronamento della diga. Disgrazia, dice la Società. Il dottor Ferrante, da Milano, preferisce un'altra parola: «Malan aveva una polizza sulla vita, quattro milioni, e dei debiti. Se si è buttato, clausola undici: non paghiamo. Mi porti un suicidio, signora Corvi.»\n\nNon ti ha minacciata. Ti ha promesso una scrivania in sede, un termosifone, la tredicesima. A quarantaquattro anni è un'offerta che non passa due volte, e Ferrante lo sa: l'ha letto nella tua pratica, alla voce «precedenti impieghi»." }]
    ];
  }

  /* ---------- scheda ---------- */
  function sheet() {
    var c = S.ch, f = S.f, who = [], facts = [], mt = [], job, time;
    time = ["", "Sera, nevica", "Mattina, cielo di latta", "Pomeriggio, vento caldo", "Notte, sereno"][c];
    if (S.end) { job = "Nessuno."; }
    else if (c === 1) { job = f.telefonato ? "Dormire. Domani guardare il morto, e chi lo piange." : "Prendere la camera e telefonare a Milano."; }
    else if (c === 2) { job = has("occhiali") ? "Mostrare gli occhiali a chi ha trovato il corpo." : (f.martaKey ? "Entrare nella baracca di Malan." : (f.mani ? "Dire alla vedova quello che hai visto." : "Capire com'è morto Malan. Cominciando da lui.")); }
    else if (c === 3) { job = f.relazione ? "Uscire dal cunicolo con la relazione." : "Scendere nel cunicolo. Le carte di Malan sono dietro il pendolo."; }
    else { job = "Prima di mezzanotte, dal centralino, fare una telefonata. Una sola."; }

    who.push(["Ferrante", "La Vigile, Milano. Il tuo capo. Vuole un suicidio: clausola undici, e i quattro milioni restano in cassa. In cambio, una scrivania in sede."]);
    who.push(["Malan", "Geologo della Società, morto da quattro giorni. " + (f.mani ? "Mani intatte: non si è aggrappato a niente." : "Caduto dal coronamento, dicono.") + (f.bepi ? " Ce l'hanno portato: Nardin e un altro, dopo le nove di sera." : "") + (f.relazione ? " Aveva scritto tutto, e l'aveva consegnato." : "")]);
    if (S.visited.albergo) { who.push(["Olga", "Padrona dell'albergo e centralinista. Tutte le telefonate del paese le passano per le mani." + (f.biglietto ? " Compresa la tua: la Società la paga per ascoltare." : "") + (f.olgaSa ? " Gliel'hai detto in faccia. Per te, dice, avrà mal di testa." : "")]); }
    if (f.v1) { who.push(["Vescovi", "Cronista della «Voce delle Valli». Querelato una volta dalla Società. Vuole carte, non voci." + (f.vescoviSa ? " Gli hai dato una voce: l'ha già dettata." : "")]); }
    if (S.visited.chiesa) { who.push(["Marta", "La vedova. Veglia il marito in chiesa. Ha un figlio in collegio e una polizza che la tua firma può annullare." + (f.martaKey ? " Ti ha dato la chiave della baracca." : "")]); }
    if (f.mo1) { who.push(["Morandin", "Direttore dei lavori. Crede nella diga come altri credono in Dio: senza cattiveria." + (f.morandinSa ? " Sa che hai guardato le mani. «Non ho chiesto come.»" : "") + (f.patto ? " Ha la relazione. Ti deve un ufficio e una rilettura." : (c === 4 ? " Gli hai detto di no." : ""))]); }
    if (f.b1) { who.push(["Bepi", "Guardiano della diga. Ha trovato il corpo." + (f.bepi ? " Ha firmato il falso, e te l'ha detto." : "") + (f.scarichi ? " Può aprire gli scarichi, se qualcuno poi firma. Il casello è il due-due." : "")]); }

    if (f.relazione) {
      mt.push("Quota 680: tre millimetri al giorno"); mt.push("Quota 700: dodici"); mt.push("Quota 710: trentacinque");
      mt.push("Quota 715: «Non frana: scivola. Tutta insieme. L'onda passa sopra la diga.»"); mt.push("Collaudo: stanotte. Quota 715 alle due.");
    } else {
      if (f.notte) { mt.push("Stanotte, alle quattro, la montagna di là dal lago ha fatto un colpo."); }
      if (f.lavagna) { mt.push("Sulla lavagna di Malan: 680: 3. 700: 12. 710: 35. 715: un punto di domanda."); }
      if (f.sismo) { mt.push("Il rullo del sismografo ha un picco alle quattro di stanotte. Non è il primo."); }
    }

    if (f.biglietto) { facts.push("Morandin sapeva del tuo incarico prima di colazione. Ieri sera, al telefono, eravate in tre."); }
    if (f.fascicolo) { facts.push("Nel verbale mancano gli occhiali e il libretto di campagna. Un miope senza occhiali, un geologo senza libretto."); }
    if (f.parapetto) { facts.push("Il parapetto è alto un metro e venti. Non ci si scivola sopra: ci si viene sollevati."); }
    if (f.cassetto) { facts.push("Nella baracca qualcuno ha forzato un cassetto. Cercava carte."); }
    if (f.martaKey) { facts.push("Malan ha scritto alla moglie: «Cerca dove la montagna scrive.»"); }
    if (f.bepi) { facts.push("La montagna scrive in due posti: sul rullo della baracca e sul pendolo del cunicolo."); }
    if (f.relazione) { facts.push("La relazione è stata consegnata a Morandin il 2 febbraio. Sei giorni dopo Malan era morto."); }
    if (f.morandinSa) { facts.push("Morandin sa che non credi alla caduta."); }
    if (f.olgaSa) { facts.push("Olga ha smesso di ascoltare le tue telefonate. Dice."); }
    if (f.vescoviSa) { facts.push("Vescovi ha dettato un pezzo sulla morte di Malan. La fonte sei tu, e in valle si sa."); }
    if (f.patto) { facts.push("Hai un accordo con la Società: «infortunio», la vedova pagata, un ufficio in Direzione."); }
    if (f.quota) { facts.push("Morandin non mente: ci crede. È peggio."); }
    if (f.olga4) { facts.push("Una linea sola, fino a mezzanotte. Quattro spine: Milano, il giornale, la diga, la canonica."); }

    return [{ t: "sheet", name: "Ada Corvi", cap: "Fototessera, 1951",
      rows: [["Età", "44 anni"],
        ["Copertura", "Nessuna. Perito liquidatore, La Vigile Assicurazioni: stavolta è vero"],
        ["Mestiere", "Marconista, 1943–45. Poi i fari. Poi questo"],
        ["Vizi", "Nazionali senza filtro. Dormire vestita. La pistola non la porta più"],
        ["Ora", CH_NAME[c] + ". " + time],
        ["Incarico", job]],
      lists: [["Chi è chi", who, true], ["La montagna", mt, false], ["Cosa sai", facts, false]] }];
  }

  function mapBlock() {
    var v = {}, id;
    for (id in S.visited) { if (S.visited.hasOwnProperty(id)) { v[id] = 1; } }
    return [{ t: "map", visited: v, room: S.room, cap: "Val Sorda e la diga del Gorgo" }];
  }

  /* ---------- capitoli ---------- */
  function sleep() {
    if (S.room !== "camera") { return [P("Non qui.")]; }
    if (S.ch !== 1) { return [P("Non è ora di dormire.")]; }
    if (!S.f.telefonato) { return [P("Non prima di aver chiamato Milano. Ferrante non dorme finché non ha una riga da mettere in pratica.")]; }
    S.moves++; S.f.notte = 1; setChapter(2);
    return [IMG("m_colpo", "Le quattro di notte, dalla camera 3"),
      P("Dormi vestita, per abitudine. Alle quattro ti sveglia un colpo.\nNon è un tuono: d'inverno non tuona. È un colpo sordo, lungo, dalla parte del lago, come un armadio spostato al piano di sopra da qualcuno molto grande. I vetri tremano nel telaio. I cani del paese abbaiano tutti insieme; poi tacciono, tutti insieme.\nQuando apri la finestra il lago ha dei cerchi che si allargano, e sull'altra riva non si è accesa una luce. Non riprendi sonno."),
      CHAP(2)].concat(describe(false));
  }

  function confess() {
    S.f.bepi = 1; S.f.b1 = 1; S.loc.chiavi = "inv"; S.loc.lampada = "inv"; S.moves++; setChapter(3);
    return [IMG("m_occhiali", "Il tavolo del casello"),
      P("Posi la custodia sul tavolo del casello e la apri. Bepi si toglie il berretto, che per lui è molto.\n«Dov'erano?»\n«Sul tavolo della baracca. Piegati.»\n«Allora è come pensavo.» Si siede. «Alle nove ho visto la luce alla baracca, e due che salivano: Nardin, il capocantiere, e uno col cappotto lungo. Alle dieci la luce era spenta. Alle undici l'ho trovato io, sotto il coronamento. Senza occhiali. Uno che senza non vedeva la forchetta.»"),
      P("«Non ha camminato fin lì. Ce l'hanno portato. E io ho firmato che era scivolato, perché ho sessantun anni e questo casello è l'unica casa che ho.»"),
      P("Stacca dal chiodo un anello di [[chiavi]] e una [[lampada]] a carburo. «La montagna scrive in due posti. Sul rullo della baracca, e quello l'hanno già guardato. E sul pendolo del cunicolo, sotto i nostri piedi, dove gli ingegneri non scendono perché ci si sporca. Le sue carte vere, il dottore le teneva lì.»"),
      CHAP(3),
      P("Verso le quattro gira il vento. Viene da sud, tiepido, e la neve comincia a gocciolare dai tetti. Bepi lo chiama favonio e si fa il segno della croce.")].concat(describe(false));
  }

  function morandinScene() {
    var f = S.f;
    S.room = "diga"; f.offerta = 1; f.mo1 = 1; S.moves++;
    return [{ t: "room", s: ROOM_NAME.diga }, IMG("m_offerta", "In fondo al coronamento"),
      P("Quando riemergi dal portello è quasi buio, e sul coronamento c'è [[Morandin]]. Cappotto chiaro, sciarpa bianca, le mani dietro la schiena. Due passi indietro, un [[avvocato]]: si capisce dalla cartella.\n«L'ha trovata. Bepi non sa mentire, e lei non sa nascondere un tubo sotto un impermeabile.»" + (f.morandinSa ? " Una pausa. «So che non crede alla caduta. Per questo sono venuto io, e non Nardin.»" : "") + (f.vescoviSa ? " «So anche cosa ha dettato il giornalista, oggi. In questa valle le linee passano tutte da una stanza.»" : "")),
      P("«Le dico io cosa c'è scritto: che a quota 715 il versante cede. Malan me l'ha letta in faccia. Io gli ho risposto che la diga tiene. E la diga tiene.» Guarda il lago. «Mi dia quei fogli. La Società riconosce l'infortunio, la signora Malan è pagata entro il mese, e per lei c'è un ufficio in Direzione, al doppio di Milano. La relazione la rileggo io. Dopo il collaudo.»\nL'avvocato apre la cartella. [[ACCETTA|accetta]], oppure [[RIFIUTA|rifiuta]].")];
  }

  function resolveOffer(accept) {
    var b;
    S.f.offerta = 0; S.moves++;
    if (accept) {
      if (!has("relazione")) { S.f.offerta = 1; S.moves--; return [P("«I fogli, signora. Le parole le ho già sentite.»")]; }
      S.f.patto = 1; S.loc.relazione = "none";
      b = [P("Gli dai il tubo. Lo passa all'avvocato senza guardarlo, come un cappello a un guardarobiere. «Stanotte detti alla sua Compagnia: infortunio. Per il resto ha la mia parola.» Dalla portiera si volta. «Non è una resa, signora. È un'assunzione.»")];
    } else {
      b = [P("Gli passi accanto, dalla parte del lago. L'avvocato fa per muoversi; Morandin alza due dita.\n«Come crede. Stanotte alle due l'acqua tocca il segno, e la montagna resta dov'è. Domani quei fogli saranno l'ossessione di un morto, e lei una donna senza posto.»\nQuando ti volti stanno salendo in macchina. Non hanno fretta. Hanno un calendario.")];
    }
    setChapter(4);
    return b.concat([CHAP(4), P("Le dieci e quaranta. Il vento caldo ha pulito il cielo, e sul coronamento sono tornati tutti, coi riflettori. Alle due l'acqua tocca quota 715. A mezzanotte la Direzione si prende l'unica linea del paese. Hai una telefonata, e quattro persone che ne vogliono quattro diverse.")]).concat(describe(false));
  }

    diga: function () {

        s += "\nMarta Malan seppellisce il marito a Pieve Sorda, vista lago. La polizza gliela pagano in tribunale, quattro anni dopo.";

  /* ---------- finali trovati: restano anche dopo RICOMINCIA ---------- */
  var END_TITLES = ["La pratica", "Il posto", "Notizie false", "Acqua bassa", "Al lupo"], foundMem = {};
  function foundEnds() {
    var o = foundMem;
    try { o = JSON.parse(localStorage.getItem("acquacheta.finali") || "null") || foundMem; } catch (e) { o = foundMem; }
    return o;
  }
  function markEnd(title) {
    var o = foundEnds(); o[title] = 1; foundMem = o;
    try { localStorage.setItem("acquacheta.finali", JSON.stringify(o)); } catch (e) { /* resta in memoria */ }
  }
  function endsNote() {
    var o = foundEnds(), got = [], i;
    for (i = 0; i < END_TITLES.length; i++) { if (o[END_TITLES[i]]) { got.push(END_TITLES[i]); } }
    if (!got.length) { return "Finali trovati: nessuno su " + END_TITLES.length + "."; }
    return "Finali trovati: " + got.length + " su " + END_TITLES.length + " (" + got.join(", ") + ")." + (got.length < END_TITLES.length ? " Gli altri restano da scoprire." : " Li hai visti tutti.");
  }

  var END_PIC = { "La pratica": ["f_pratica", "Milano, sede"], "Il posto": ["f_posto", "Direzione lavori, marzo"], "Notizie false": ["f_notizie", "Terza pagina"],

  var DEST_NAME = { milano: "Milano", giornale: "il giornale", diga: "la diga", paese: "la canonica" };
  function call(word) {
    var dest = DEST[word], e, fin;
    if (S.room === "albergo" && S.ch === 1) { return act("usa", "telefono"); }
    if (S.room !== "centralino") { return [P(S.room === "albergo" ? "La cabina passa dal centralino, e il centralino è di Olga." : "Da qui puoi chiamare solo a voce. Il telefono del paese è all'albergo.")]; }
    if (!S.f.cuffia) { return [P("Il quadro è muto finché non ti metti la [[cuffia]].")]; }
    if (!dest) { return [P("Quale spina? " + SPINE + ".")]; }
    e = ENDINGS[dest]();
    S.moves++; S.end = { "La pratica": 1, "Il posto": 2, "Notizie false": 3, "Acqua bassa": 4, "Al lupo": 5 }[e[0]]; markEnd(e[0]);
    fin = END_PIC[e[0]];
    return [IMG("tx_" + dest, "Mezzanotte meno dieci: " + DEST_NAME[dest]), P(e[1]), IMG(fin[0], fin[1]),
      { t: "end", s: "Fine — " + e[0] },
      NOTE("Hai chiuso la storia in " + S.moves + " mosse. " + endsNote() + " [[RICOMINCIA CAPITOLO|ricomincia capitolo]] per rifare la notte e cercare un altro finale, [[RICOMINCIA|ricomincia]] per ripartire da capo, [[STORIE|storie]] per tornare all'elenco delle storie.")];
  }

  /* ---------- movimento ---------- */
  function go(dir) {
    var r = S.room, c = S.ch, f = S.f, to = EXITS[r][dir];
    if (f.offerta) {
      if (dir === "sud") { return resolveOffer(false); }
      return [P("Morandin è tra te e la strada. Dietro hai il portello, e sotto il portello non c'è un'altra uscita.")];
    }
    if (!to) { return [P("Da quella parte non si va.")]; }
    if (r === "piazza" && dir === "nord" && c === 1) { return [P("Di notte, con questa neve, la strada del lago è per chi ha fretta di morire. Domani.")]; }
    if (r === "piazza" && dir === "ovest" && c === 1) { return [P("Chiusa. Dentro c'è un lume acceso, e qualcuno che stanotte non ha bisogno di compagnia.")]; }
    if (r === "albergo" && dir === "su") {
      if (c === 4) { return [P("Non è notte da dormire.")]; }
      if (!has("chiave")) { return [P("Le camere sono di sopra. Senza chiave resti un'avventrice.")]; }
    }
    if (r === "albergo" && dir === "est") {
      if (c !== 4) { return [P("Dietro il banco c'è il centralino, e davanti al centralino c'è Olga. Di lì non si passa.")]; }
      if (!f.olga4) { S.t.o = 0; return talkLine("olga").concat([P("Si sposta di un passo. Dietro il banco, a [[est]], la porta dello stanzino è aperta.")]); }
    }
    if (r === "strada" && dir === "su" && !f.lucchetto) {
      if (!has("chiavetta")) { return [P("Sali fino alla baracca: una porta di abete e un [[lucchetto]] nuovo, marchiato S.I.M.A. Dalla finestra si vede un tavolo, e poco altro. Ridiscendi.")]; }
      f.lucchetto = 1;
      return [P("La chiavetta di Marta entra nel lucchetto della Società come se non avesse mai fatto altro. Lo sfili e lo appendi al chiodo.")].concat(move(to));
    }
    if (r === "strada" && dir === "est" && c === 4) { return [P("Buia. Stanotte la Società è tutta sul coronamento.")]; }
    if (r === "diga" && dir === "giu" && !f.portello) { return [P("Il portello del cunicolo è chiuso col catenaccio." + (has("chiavi") ? " Nell'anello di Bepi c'è la sua chiave: [[APRI|apri portello]]." : ""))]; }
    if (r === "cunicolo" && dir === "su" && c === 3 && has("relazione")) { return morandinScene(); }
    return move(to);
  }
  function move(to) {
    var first = !S.visited[to];
    S.room = to; S.moves++; S.visited[to] = 1;
    return describe(first);
  }

  /* ---------- dialoghi ---------- */
  function line(arr, key) { var i = Math.min(S.t[key], arr.length - 1); if (S.t[key] < 3) { S.t[key]++; } return [P(arr[i])]; }

  function talk(who) { return talkLine(who).concat(who && who !== "commissione" ? topicList(who) : []); }
  function talkLine(who) {
    var c = S.ch, f = S.f, shown;
    S.moves++;

          f.olgaKey = 1; S.loc.chiave = "inv";
          return [P("«La signora di Milano.» Non è una domanda. «La camera è la tre. Pagata dalla Società, tre notti.» Ti mette in mano una [[chiave]] con la targhetta di legno. «Io non ho chiesto niente a nessuno. Lo dico adesso, perché poi lo chiedono a me.»\nNon hai ancora detto come ti chiami.")];
        }
        return line(["«A quest'ora la cucina è una pentola sola. [[Minestra]] d'orzo.»", "«Il dottor Malan mangiava a quel tavolo.» Indica il più vicino alla stufa. Stasera non ci si è seduto nessuno.", "«Buonanotte. Se di notte sente dei rumori, è la montagna. Ci si abitua.»"], "o");
      }

        return line(["«Caffè d'orzo e pane di ieri. Quello di oggi lo porta la corriera, se sale.»", "«Dormito?» Non aspetta la risposta. «Alle quattro hanno abbaiato tutti i cani. Poi hanno smesso tutti insieme. È quello che non mi piace: quando smettono.»", "«La vedova è in chiesa. La Direzione è sulla strada del lago. È venuta per tutti e due, no?»"], "o");
      }
      if (c === 3) { return line(["«Il favonio», dice, guardando la gronda che gocciola. «Mia madre col favonio non faceva il pane. Diceva che non lievita niente di buono.»", "«L'ingegnere ha fatto tre telefonate in un'ora. Non le dico a chi.» Una pausa. «A Venezia.»"], "o"); }
      f.olga4 = 1;
      return line(["«Ho un filo solo sul passo, e a mezzanotte la Direzione mi prende il quadro per il collaudo.» Si sfila la cuffia e te la porge dal verso giusto, come si porge un coltello. «Lei in guerra faceva questo mestiere. Me l'ha detto Milano, senza volere. Una chiamata, signora. Scelga bene la spina.»",
        "«Milano, il giornale, il casello della diga, la canonica. Le targhette le ho scritte io.» Guarda la pendola. «Io sto sulla porta. Stanotte ho mal di testa.»",
        "«Vada. Dietro il banco, a [[est]].»"], "o");
    }
    if (who === "vescovi") {
      f.v1 = 1;
      if (c === 1) {
        return line(["Smette di battere. «Gino Vescovi, della “Voce delle Valli”. Lei è l'assicurazione.» Non è una domanda nemmeno la sua. «Qui le notizie salgono con la corriera. Lei è salita con la notizia.»",
          "«Un consiglio: non chieda a nessuno se Malan era triste. Le diranno tutti di sì. È la risposta che costa meno.»"], "v");
      }
      if (c === 2) { return line(["«Ha sentito, stanotte? Ecco. Io sono qui per quello, da tre settimane. In redazione dicono che faccio la villeggiatura.»", "«La Società dice: disgrazia. La sua Compagnia dirà: suicidio. Ci sarebbe una terza parola, ma nessuno paga per sentirla.»"], "v"); }
      if (c === 3) { return line(["«Stanotte collaudano. Ho il pezzo pronto in due versioni: “Trionfo della tecnica”, e l'altra. L'altra non ha ancora un titolo.»", "«Se trova qualcosa di scritto, signora Corvi, io sono a questo tavolo.»"], "v"); }

    }
    if (who === "marta") {
      if (c === 2) {
        return line(["Non si alza. «Lei è quella di Milano. Mi hanno detto che avrebbero mandato una donna. Pensavano fosse una gentilezza.»",
          "«Guardi pure. L'hanno già guardato in tanti: il medico, i carabinieri, l'ingegnere. Tutti di fretta.» Indica il lenzuolo. «Lei, almeno, gli guardi le [[mani]].»",

      return line(["«Alle due», dice. «Me l'ha detto il sagrestano: alle due l'acqua arriva in cima. Ettore diceva: a quella quota, mai.»", "«Qualunque cosa decida, non la faccia per me. Io ho già perso. La faccia per quelli che dormono.»"], "m");
    }
    if (who === "bepi") {
      f.b1 = 1;
      if (c === 2) {
        return line(["«Tormen Giuseppe, guardiano. Lei è quella delle assicurazioni.» Sputa di lato, con educazione. «Le dico subito quello che ho detto ai carabinieri: l'ho trovato io, era morto, nevicava.»",
          "«Il coronamento d'inverno è una lastra, sì. Ma lui ci passava dieci volte al giorno, da quattro anni. Con le scarpe coi chiodi.» Guarda il [[parapetto]]. «E quel coso è alto così.»",

      }
      if (c === 3) { return line(["«Sessanta gradini, poi dritto. Non tocchi il filo del pendolo: la sente anche se respira.»", "«Faccia presto. Col favonio, la sera, l'ingegnere viene a guardare il lago.»"], "b"); }
      return line(["È seduto al buio, accanto ai volantini. «Li sente? Ridono. Hanno portato lo spumante, per le due.»", "«Io sono qui. Il telefono è lì.» Indica l'apparecchio a muro. «Due-due.»"], "b");
    }
    if (who === "morandin") {
      if (f.offerta) { return [P("«Non ho fretta, signora. Ce l'ha l'acqua.» [[ACCETTA|accetta]] o [[RIFIUTA|rifiuta]].")]; }
      f.mo1 = 1;
      if (c === 2) {
        return line(["Si alza, ti porge la mano, ti indica la sedia: tre gesti in uno. «Signora Corvi. Sapevo che sarebbe venuta: mi sono permesso di farle trovare la camera calda.» Sorride. «Mi dica cosa le serve per chiudere.»",
          "«Malan è scivolato. C'è un [[fascicolo]]: verbale, inventario, fotografie. Lo legga con comodo. Siamo una società per azioni, signora: non abbiamo segreti, abbiamo protocolli.»",
          "«Posso dirle una cosa da ingegnere? Le dighe non cadono per i dubbi. Cadono per i ritardi.»"], "g");

  }

    g.pline([[0, 52], [30, 44], [48, 50]], 16); g.pline([[72, 48], [96, 40], [119, 50]], 16);

    for (y = 48; y < 65; y += 5) { g.px(52 + (y % 3) * 4, y, 9); g.px(66 - (y % 2) * 3, y + 2, 9); }
    /* cella campanaria */

    g.maskOn(); g.poly([[58 + sw, 31], [62 + sw, 31], [64 + sw, 39], [56 + sw, 39]], 0); g.keyline(16); g.rect(59 + sw, 40, 60 + sw, 41, 0);
    g.vline(60, 26, 31, 0);
    /* orologio e feritoia */
    g.ring(60, 51, 4, 4, 16); g.line(60, 51, 60, 48, 16); g.line(60, 51, 62, 52, 16);
    g.rect(59, 58, 61, 64, 16);

  });

  /* ---------- ritratti a mezzo busto ---------- */
  OBJ.olga = plate("OLGA DAL MOLIN", 10, function (g) {

    /* grembiule */

    g.hline(52, 68, 53, 9);
    /* la cuffia, al collo */
    g.arc(60, 42, 13, 6, 0, PI, 0); g.arc(60, 43, 13, 6, 0, PI, 0); g.arc(60, 44, 13, 6, 0, PI, 16);
    g.maskOn(); g.ell(47, 42, 4, 5, 16); g.ell(73, 42, 4, 5, 16); g.keyline(0); g.ell(47, 42, 2, 3, 9); g.ell(73, 42, 2, 3, 9);
    g.pline([[73, 47], [78, 54], [76, 62], [80, 65]], 0);

  OBJ.vescovi = plate("GINO VESCOVI", 4, function (g) {

    g.line(64, 10, 70, 8, 16); g.line(66, 12, 72, 11, 16);

  OBJ.commissione = plate("LA COMMISSIONE", 9, function (g) {
    bust(g, 24, 24, 0.7, { hat: "fedora", coat: 16, key: 0, glasses: 1, lapels: 0, tie: 9 });

    bust(g, 60, 21, 0.78, { hat: "fedora", coat: 16, key: 0, glasses: 1, scarf: 0, lapels: 0, tie: 6 });
    /* la cartella */
    g.maskOn(); g.poly([[78, 46], [100, 44], [102, 62], [80, 64]], 0); g.keyline(16);
    g.hline(84, 96, 50, 9); g.hline(84, 94, 54, 9); g.rect(88, 43, 94, 46, 16);

  var OBJN = ["lettera", "sigarette", "chiave", "chiavetta", "occhiali", "chiavi", "lampada", "relazione", "telefono", "banco", "minestra", "macchina", "stufa",
    "valigia", "letto", "biglietto", "orario", "fontana", "avviso", "corpo", "mani", "fascicolo", "plastico", "fotografia", "lucchetto", "lucchettoAperto",
    "scrivania", "sismografo", "lavagna", "calendario", "parapetto", "orologio", "idrometro", "idrometro4", "scarichi", "portello", "pendolo", "spie",
    "tubo", "tuboAperto", "tuboVuoto", "quadro", "cuffia", "marcia", "campanile", "olga", "vescovi", "marta", "bepi", "morandin", "commissione"];
  Pix.addObjects(OBJ, OBJN);
})();

/* ==================================================================
   INTERFACCIA. Un ridisegno per turno. L'unica cosa che si muove sono
   le tavole: pochi fotogrammi, cambiati un paio di volte al secondo,
   e si possono fermare.
   ================================================================== */
if (typeof document !== "undefined") {
  (function () {
    var screen = document.getElementById("screen"), out = document.getElementById("out"), input = document.getElementById("cmd-input");
    var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    var prefs = { mode: "rullo", motion: !reduce, size: 1 }, turns = [], pos = 0, pending = null, atTop = true;
    var canCanvas = !!document.createElement("canvas").getContext;
    var DIR_LABEL = { nord: "NORD", sud: "SUD", est: "EST", ovest: "OVEST", su: "SU", giu: "GIÙ" };
    var anim = [], tick = 0, timer = null;

    try { var p = JSON.parse(localStorage.getItem("vialibera.prefs") || "null"); if (p && p.mode) { prefs.mode = p.mode; prefs.motion = !!p.motion; prefs.size = p.size === 2 || p.size === 3 ? p.size : 1; } } catch (e) { /* preferenze predefinite */ }

    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (text) { e.appendChild(document.createTextNode(text)); } return e; }
    function kw(label, word, cmd) {
      var k = el("span", "kw", label);
      if (cmd) { k.setAttribute("data-run", cmd); } else { k.setAttribute("data-kw", word); }
      k.setAttribute("role", "button"); k.setAttribute("tabindex", "0");
      return k;
    }
    function addText(parent, s) {
      var lines = s.split("\n"), i, re = /\[\[([^\]]+)\]\]/g, m, last, parts;
      for (i = 0; i < lines.length; i++) {
        if (i) { parent.appendChild(document.createElement("br")); }
        last = 0; re.lastIndex = 0;
        while ((m = re.exec(lines[i]))) {
          if (m.index > last) { parent.appendChild(document.createTextNode(lines[i].substring(last, m.index))); }
          parts = m[1].split("|");
          parent.appendChild(kw(parts[0], parts[0], parts[1]));
          last = m.index + m[0].length;
        }
        if (last < lines[i].length) { parent.appendChild(document.createTextNode(lines[i].substring(last))); }
      }
    }
    function avail() { return Math.max(160, out.clientWidth - 36); }
    function figure(canvas, cap) {
      var f = el("figure");
      if (canvas) { canvas.setAttribute("role", "img"); canvas.setAttribute("aria-label", cap || "Tavola"); f.appendChild(canvas); if (canvas._paint) { anim.push(canvas); } }
      if (cap) { f.appendChild(el("figcaption", "", cap)); }
      return f;
    }

    function renderTurn(turn) {
      var box = el("div", "turn"), i, j, q, b, e, c, parts, dl, ul, who, L;
      if (turn.cmd) { box.appendChild(el("p", "echo", "> " + turn.cmd)); }
      for (i = 0; i < turn.blocks.length; i++) {
        b = turn.blocks[i];
        if (b.t === "p" || b.t === "note" || b.t === "room") {
          e = el("p", b.t === "p" ? "" : b.t); addText(e, b.s); box.appendChild(e);
        } else if (b.t === "front") {
          e = el("div", "front"); e.appendChild(el("h2", "", b.s)); e.appendChild(el("span", "", b.sub)); box.appendChild(e);
        } else if (b.t === "chapter") {
          e = el("div", "chapter"); e.appendChild(el("span", "", b.n)); e.appendChild(el("h2", "", b.s)); box.appendChild(e);
        } else if (b.t === "prosa") {
          e = el("div", "prosa"); parts = b.s.split("\n\n");
          for (j = 0; j < parts.length; j++) { e.appendChild(el("p", "", parts[j])); }
          box.appendChild(e);
        } else if (b.t === "img") {
          box.appendChild(figure(canCanvas ? Pix.make(b.id, Math.min(avail(), Pix.scenes[b.id].w > 120 ? 480 : 240)) : null, b.cap));
        } else if (b.t === "map") {
          box.appendChild(figure(canCanvas ? Pix.makeMap(b, Math.min(avail(), 480)) : null, b.cap));
        } else if (b.t === "code") {
          box.appendChild(el("p", "code", b.s));
        } else if (b.t === "sheet") {
          e = el("div", "sheet");
          e.appendChild(figure(canCanvas ? Pix.make("ritratto", 128) : null, b.cap));
          who = el("div", "who"); who.appendChild(el("h2", "", b.name)); dl = el("dl");
          for (j = 0; j < b.rows.length; j++) { dl.appendChild(el("dt", "", b.rows[j][0])); dl.appendChild(el("dd", "", b.rows[j][1])); }
          who.appendChild(dl); e.appendChild(who); box.appendChild(e);
          for (j = 0; j < b.lists.length; j++) {
            L = b.lists[j];
            if (!L[1].length) { continue; }
            box.appendChild(el("p", "facts-title", L[0]));
            if (L[2]) {
              dl = el("dl", "people");
              for (q = 0; q < L[1].length; q++) { dl.appendChild(el("dt", "", L[1][q][0])); dl.appendChild(el("dd", "", L[1][q][1])); }
              box.appendChild(dl);
            } else {
              ul = el("ul", "facts"); for (q = 0; q < L[1].length; q++) { ul.appendChild(el("li", "", L[1][q])); }
              box.appendChild(ul);
            }
          }
        } else if (b.t === "end") {
          box.appendChild(el("p", "end", b.s));
        }
      }
      return box;
    }

    function renderPanel() {
      var st = PC.status(), ex = PC.exits(), inv = PC.inventory(), dir = document.getElementById("chips-dir"), bag = document.getElementById("bag"), i, b;
      var reading = prefs.mode === "pagina" && turns[pos].kind === "tavola";
      document.getElementById("st-room").textContent = reading ? "Prologo" : st.room;
      document.getElementById("st-moves").textContent = "Cap. " + st.ch + " · Mosse " + st.moves;
      screen.className = "screen " + prefs.mode + " t" + prefs.size + (reading ? " reading" : "");
      document.getElementById("pg-label").textContent = "Pag. " + (pos + 1) + " di " + turns.length;
      document.getElementById("pg-prev").disabled = pos === 0;
      document.getElementById("pg-next").disabled = pos === turns.length - 1;

      while (dir.firstChild) { dir.removeChild(dir.firstChild); }
      for (i = 0; i < ex.length; i++) { b = el("button", "chip", DIR_LABEL[ex[i]]); b.type = "button"; b.setAttribute("data-cmd", ex[i]); dir.appendChild(b); }
      dir.appendChild(el("span", "spacer"));
      b = el("button", "chip", "GUARDA"); b.type = "button"; b.setAttribute("data-cmd", "guarda"); dir.appendChild(b);

      while (bag.firstChild) { bag.removeChild(bag.firstChild); }
      for (i = 0; i < inv.length; i++) { if (i) { bag.appendChild(el("span", "sep", "·")); } bag.appendChild(kw(inv[i].label, inv[i].word)); }
      if (!inv.length) { bag.appendChild(document.createTextNode("niente")); }
    }

    function render() {
      var i, from, b;
      anim = [];
      while (out.firstChild) { out.removeChild(out.firstChild); }
      if (prefs.mode === "pagina") {
        out.appendChild(renderTurn(turns[pos]));
        if (pos < turns.length - 1) {
          b = el("button", "chip go turn-next", "Volta pagina ▶"); b.type = "button"; b.id = "turn-next";
          b.onclick = function () { goPage(pos + 1); };
          out.appendChild(b);
        }
        out.scrollTop = 0;
      } else {
        from = Math.max(0, turns.length - 24);
        for (i = from; i < turns.length; i++) { out.appendChild(renderTurn(turns[i])); }
        out.scrollTop = atTop ? 0 : out.scrollHeight;
      }
      renderPanel();
      runMotion();
    }

    function runMotion() {
      var i;
      if (timer) { clearInterval(timer); timer = null; }
      if (!prefs.motion || !anim.length) { for (i = 0; i < anim.length; i++) { anim[i]._paint(0); } return; }
      timer = setInterval(function () {
        tick++;
        for (var j = 0; j < anim.length; j++) { anim[j]._paint(tick); }
      }, 480);
    }

    var drawer = document.getElementById("drawer"), drawerBtn = document.getElementById("drawer-btn");
    function setDrawer(open) {
      drawer.className = open ? "drawer" : "drawer off";
      drawerBtn.textContent = open ? "CHIUDI" : "COMANDI";
      drawerBtn.className = open ? "chip on" : "chip";
      drawerBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    drawerBtn.onclick = function () { setDrawer(drawer.className.indexOf("off") >= 0); };

    function goPage(n) { pos = Math.max(0, Math.min(turns.length - 1, n)); render(); }
    function pushPrologue() {
      var pages = PC.prologue(), i, first = turns.length;
      for (i = 0; i < pages.length; i++) { turns.push({ cmd: null, blocks: pages[i], kind: "tavola" }); }
      return first;
    }
    function begin(forceNew) {
      var st = PC.start(forceNew);
      turns = []; pos = 0; atTop = true;
      if (!st.resumed) { pushPrologue(); }
      turns.push({ cmd: null, blocks: st.blocks, kind: "turno" });
      if (st.resumed) { pos = turns.length - 1; atTop = false; }
      render();
    }

    function goHome() { window.location.href = "index.html"; }
    function setPending(verb) {
      var chips = document.getElementById("chips-verb").getElementsByTagName("button"), i;
      pending = verb;
      for (i = 0; i < chips.length; i++) { chips[i].className = chips[i].getAttribute("data-verb") === verb ? "chip on" : "chip"; }
      input.value = verb ? verb + " " : "";
      input.placeholder = verb ? "tocca una parola sottolineata" : "scrivi un comando";
    }

    function run(cmd) {
      var blocks, first, cut, i;
      cmd = String(cmd).replace(/^\s+|\s+$/g, "");
      if (!cmd) { return; }
      blocks = PC.exec(cmd);
      setPending(null);
      setDrawer(false);
      if (blocks.length && blocks[0].t === "restart") { begin(true); return; }
      if (blocks.length && blocks[0].t === "home") { goHome(); return; }
      atTop = false;
      if (blocks.length && blocks[0].t === "prologue") {
        first = pushPrologue();
        turns.push({ cmd: null, blocks: PC.look(), kind: "turno" });
        pos = prefs.mode === "pagina" ? first : turns.length - 1;
      } else {
        /* un cambio di capitolo apre una pagina nuova: prima si legge come finisce il vecchio */
        cut = -1;
        for (i = 1; i < blocks.length; i++) { if (blocks[i].t === "chapter") { cut = i; break; } }
        if (cut < 0) { turns.push({ cmd: cmd, blocks: blocks, kind: "turno" }); pos = turns.length - 1; }
        else {
          turns.push({ cmd: cmd, blocks: blocks.slice(0, cut), kind: "turno" });
          turns.push({ cmd: null, blocks: blocks.slice(cut), kind: "turno" });
          pos = prefs.mode === "pagina" ? turns.length - 2 : turns.length - 1;
        }
      }
      while (turns.length > 60) { turns.shift(); pos--; }
      render();
    }

    function tapWord(w) {
      if (PC.isDir(w)) { run(w); }
      else if (pending) { run(pending + " " + w); }
      else { run("esamina " + w); }
    }

    screen.onclick = function (ev) {
      var t = ev.target, cmd, verb;
      if (!t || !t.getAttribute) { return; }
      if (t.className === "kw") { if (t.getAttribute("data-run")) { run(t.getAttribute("data-run")); } else { tapWord(t.getAttribute("data-kw")); } return; }
      cmd = t.getAttribute("data-cmd"); verb = t.getAttribute("data-verb");
      if (cmd) { run(cmd); }
      else if (verb) { setPending(pending === verb ? null : verb); }
    };
    screen.onkeydown = function (ev) {
      var t = ev.target;
      if (t && t.className === "kw" && (ev.keyCode === 13 || ev.keyCode === 32)) { ev.preventDefault(); t.click(); }
    };
    document.getElementById("pg-prev").onclick = function () { goPage(pos - 1); };
    document.getElementById("pg-next").onclick = function () { goPage(pos + 1); };
    document.getElementById("cmd-form").onsubmit = function (ev) { ev.preventDefault(); run(input.value); };

    function setPref(key, val) {
      prefs[key] = val;
      try { localStorage.setItem("vialibera.prefs", JSON.stringify(prefs)); } catch (e) { /* non indispensabile */ }
      syncSwitch(); render();
    }
    function syncSwitch() {
      var pairs = [["mode-pagina", prefs.mode === "pagina"], ["mode-rullo", prefs.mode === "rullo"], ["mot-on", prefs.motion], ["mot-off", !prefs.motion], ["size-1", prefs.size === 1], ["size-2", prefs.size === 2], ["size-3", prefs.size === 3]], i;
      for (i = 0; i < pairs.length; i++) { document.getElementById(pairs[i][0]).setAttribute("aria-pressed", pairs[i][1] ? "true" : "false"); }
    }
    document.getElementById("mode-pagina").onclick = function () { setPref("mode", "pagina"); };
    document.getElementById("mode-rullo").onclick = function () { setPref("mode", "rullo"); };
    document.getElementById("mot-on").onclick = function () { setPref("motion", true); };
    document.getElementById("mot-off").onclick = function () { setPref("motion", false); };
    document.getElementById("size-1").onclick = function () { setPref("size", 1); };
    document.getElementById("size-2").onclick = function () { setPref("size", 2); };
    document.getElementById("size-3").onclick = function () { setPref("size", 3); };
    /* ricominciare: due tocchi, perché si perde la partita */
    var RE = [["re-cap", "Capitolo", "ricomincia capitolo"], ["re-all", "Da capo", "ricomincia"]];
    function disarm() {
      for (var i = 0; i < RE.length; i++) { var b = document.getElementById(RE[i][0]); b.removeAttribute("data-armed"); b.textContent = RE[i][1]; b.className = "chip"; }
    }
    function closePrefs() { var p = document.getElementById("ref-prefs"); document.getElementById("prefs").className = "prefs off"; p.className = "chip"; p.setAttribute("aria-expanded", "false"); }
    function armButton(r) {
      var b = document.getElementById(r[0]);
      b.onclick = function () {
        if (b.getAttribute("data-armed")) { disarm(); closePrefs(); run(r[2]); return; }
        disarm(); b.setAttribute("data-armed", "1"); b.textContent = "Sicuro? Tocca ancora"; b.className = "chip on";
      };
    }
    armButton(RE[0]); armButton(RE[1]);
    document.getElementById("go-home").onclick = goHome;
    document.getElementById("ref-prefs").onclick = function () {
      var box = document.getElementById("prefs"), open = box.className.indexOf("off") >= 0;
      disarm();
      box.className = open ? "prefs" : "prefs off";
      this.className = open ? "chip on" : "chip";
      this.setAttribute("aria-expanded", open ? "true" : "false");
    };

    var resizeTimer = null, lastW = 0;
    window.onresize = function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { if (out.clientWidth !== lastW) { lastW = out.clientWidth; render(); } }, 250);
    };

    syncSwitch();
    /* dall'elenco delle storie si può arrivare con #nuova: partita da capo. Il segno si toglie subito, così ricaricare la pagina non la azzera di nuovo */
    var fromNew = window.location.hash === "#nuova";
    if (fromNew) { try { window.location.hash = ""; } catch (e) { /* resta */ } }
    begin(fromNew);
    lastW = out.clientWidth;
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) { document.fonts.ready.then(function () { render(); }); }
  })();
}
