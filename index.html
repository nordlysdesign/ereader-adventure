<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Via Libera</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
/* Layout: una scrivania grigia con sopra un e-reader. Dentro lo schermo solo carta e inchiostro:
   prologo e titoli dei capitoli sono impaginati come un romanzo, il gioco come un terminale.
   Tema unico per scelta: e' la resa di un pannello e-ink. */
:root {
  color-scheme: light;
  --desk: #c7cbc9;
  --desk-ink: #23282a;
  --bezel: #1d2022;
  --paper: #f1f0ea;
  --ink: #111111;
  --ink-soft: #565a5b;
  --mono: "IBM Plex Mono", "Courier New", Courier, monospace;
  --serif: "Old Standard TT", "Century Schoolbook", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #c7cbc9; color: #23282a; font-family: "IBM Plex Mono", "Courier New", Courier, monospace; font-size: 14.5px; line-height: 1.5; }

.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }

.demo-bar { width: 100%; max-width: 600px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.demo-bar h1 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-weight: 700; font-size: 27px; line-height: 1; margin: 0; letter-spacing: 3px; text-transform: uppercase; }
.demo-bar p { margin: 4px 0 0; font-size: 12px; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.seg { display: flex; }
.seg button { font: 600 12px/1 "IBM Plex Mono", "Courier New", Courier, monospace; color: #23282a; background: transparent; border: 2px solid #23282a; padding: 0 10px; min-height: 32px; cursor: pointer; border-radius: 0; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: #23282a; color: #c7cbc9; }

.device { flex: 1 1 auto; width: 100%; max-width: 600px; min-height: 600px; max-height: 900px; display: flex; background: #1d2022; padding: 22px 22px 40px; border-radius: 18px; }
.screen { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #f1f0ea; color: #111111; }

.status { display: flex; justify-content: space-between; gap: 12px; background: #111111; color: #f1f0ea; font-weight: 600; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 16px; }
.status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- pagina ---------- */
.out { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 14px 16px 6px; }
.out p { margin: 0 0 10px; max-width: 64ch; }
.out .room { font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; }
.out .echo { font-weight: 600; margin: 0 0 8px; }
.out .note { color: #565a5b; font-size: 13px; }
.out .turn + .turn { border-top: 1px dashed #111111; padding-top: 12px; margin-top: 6px; }
.kw { font-weight: 600; border-bottom: 2px dotted #111111; cursor: pointer; }

.front { text-align: center; margin: 2px 0 10px; }
.front h2 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 30px; letter-spacing: 5px; text-transform: uppercase; margin: 0; line-height: 1.1; text-wrap: balance; }
.front span { display: block; font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-style: italic; font-size: 15px; margin-top: 2px; }
.prosa p { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 17.5px; line-height: 1.46; max-width: 60ch; margin: 0 0 9px; }
.prosa p:first-child::first-letter { float: left; font-weight: 700; font-size: 3.05em; line-height: 0.86; padding: 3px 7px 0 0; }

figure { margin: 2px 0 12px; }
figure canvas { display: block; margin: 0 auto; border: 2px solid #111111; max-width: 100%; }
figcaption { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-style: italic; font-size: 14px; text-align: center; margin-top: 5px; }

.sheet { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: flex-start; margin-bottom: 8px; }
.sheet figure { flex: 0 0 auto; margin: 0; }
.sheet figure canvas { border: 0; }
.sheet figcaption { max-width: 124px; font-size: 12.5px; line-height: 1.25; }
.sheet .who { flex: 1 1 240px; min-width: 0; }
.sheet h2 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 6px; line-height: 1.1; border-bottom: 2px solid #111111; padding-bottom: 4px; }
.sheet dl { margin: 0; font-size: 13px; line-height: 1.4; }
.sheet dt { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin-top: 6px; }
.sheet dd { margin: 0; }
.facts { margin: 0 0 8px; padding: 8px 0 0 18px; border-top: 1px solid #111111; font-size: 13px; }
.facts-title { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin: 0 0 -4px; }
.end { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-style: italic; font-size: 20px; text-align: center; border-top: 2px solid #111111; border-bottom: 2px solid #111111; padding: 8px 0; margin: 14px 0 10px; }
.turn-next { display: block; width: 100%; margin: 6px 0 8px; }

/* ---------- comandi ---------- */
.chip { font: 600 12.5px/1 "IBM Plex Mono", "Courier New", Courier, monospace; color: #111111; background: #f1f0ea; border: 2px solid #111111; border-radius: 0; padding: 0 8px; min-width: 38px; min-height: 36px; cursor: pointer; }
.chip.on { background: #111111; color: #f1f0ea; }
.chip:disabled { border-style: dotted; color: #565a5b; cursor: default; }
.chip.go { min-height: 42px; font-size: 14px; }

.book { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 16px; border-top: 2px solid #111111; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager span { font-size: 12px; min-width: 88px; text-align: center; }
.refs { display: flex; gap: 6px; }
.screen.rullo .pager { visibility: hidden; }

.rows { display: grid; grid-template-columns: 58px 1fr; gap: 6px 8px; align-items: center; padding: 0 16px; }
.rows .lab { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #565a5b; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; }
.chips .spacer { flex: 1 1 auto; }
.bag { font-size: 13.5px; line-height: 1.9; }
.bag .sep { padding: 0 7px; color: #565a5b; }

.cmd { display: flex; align-items: center; gap: 8px; padding: 6px 16px 14px; }
.cmd label { font-weight: 600; font-size: 18px; }
.cmd input { flex: 1 1 auto; min-width: 0; font: 400 16px/1.2 "IBM Plex Mono", "Courier New", Courier, monospace; color: #111111; background: #f1f0ea; border: 0; border-bottom: 2px solid #111111; border-radius: 0; padding: 6px 2px; }
.cmd input::placeholder { color: #565a5b; }
.screen.reading .rows, .screen.reading .cmd { display: none; }
.screen.reading .book { padding-bottom: 14px; }

button:focus-visible, input:focus-visible, .kw:focus-visible { outline: 3px solid #111111; outline-offset: 2px; }
.seg button:focus-visible { outline-color: #23282a; }

.foot { width: 100%; max-width: 600px; margin: 0; font-size: 12px; }

@media (max-width: 640px) {
  .stage { padding: 0; gap: 0; }
  .demo-bar { padding: 10px 16px; }
  .demo-bar h1 { font-size: 22px; }
  .device { padding: 0; border-radius: 0; max-height: none; min-height: 560px; }
  .foot { padding: 8px 16px; }
  .rows { grid-template-columns: 1fr; gap: 2px; }
  .rows .lab { margin-top: 4px; }
}

/* ---------- terza prova ---------- */
.switches { display: flex; flex-wrap: wrap; gap: 8px 16px; }
figure canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.sheet figure canvas { border: 2px solid #111111; }
.chapter { text-align: center; border-top: 2px solid #111111; border-bottom: 2px solid #111111; padding: 10px 0 12px; margin: 4px 0 14px; }
.chapter span { display: block; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
.chapter h2 { font-family: "Old Standard TT", "Century Schoolbook", Georgia, serif; font-size: 27px; font-style: italic; font-weight: 400; margin: 2px 0 0; line-height: 1.15; text-wrap: balance; }
.out .code { font-size: 19px; font-weight: 600; letter-spacing: 2px; border: 2px solid #111111; padding: 10px 12px; text-align: center; word-break: break-all; max-width: none; }
.people { margin: 0 0 8px; padding-top: 6px; border-top: 1px solid #111111; font-size: 13px; line-height: 1.4; }
.people dt { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin-top: 6px; }
.people dd { margin: 0; }
.facts { list-style: square; }
/* impostazioni: un pannello dentro lo schermo, aperto dal pulsante Aa */
.book { flex-wrap: wrap; }
.screen.rullo .pager { display: none; }
.screen.rullo .book { justify-content: flex-end; }
.prefs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 16px 10px; border-top: 2px solid #111111; }
.prefs.off { display: none; }
.prefs .switch { color: #111111; }
.prefs .seg button { color: #111111; border-color: #111111; background: #f1f0ea; }
.prefs .seg button[aria-pressed="true"] { background: #111111; color: #f1f0ea; }
.prefs .seg button:focus-visible { outline-color: #111111; }
.prefs .restart .chip { margin-left: 6px; }
.prefs-note { width: 100%; margin: 0; font-size: 12px; color: #565a5b; }
/* cassetto: di base resta solo la riga di comando, il resto si apre con COMANDI */
.drawer.off { display: none; }
.drawer { border-top: 2px solid #111111; padding-bottom: 8px; }
.drawer .book { border-top: 0; }
.cmd { border-top: 2px solid #111111; padding-top: 8px; }
.screen.reading .drawer.off { display: block; }
.screen.reading .drawer .rows, .screen.reading .drawer .refs { display: none; }
/* dimensione del testo, scelta in Aa */
.screen.t2 .out { font-size: 17px; } .screen.t2 .out .note { font-size: 15px; } .screen.t2 .prosa p { font-size: 20px; }
.screen.t3 .out { font-size: 20px; } .screen.t3 .out .note { font-size: 17px; } .screen.t3 .prosa p { font-size: 23px; }
@media (max-width: 640px) { .stage { min-height: 100%; } .device { min-height: 100%; } }
</style>
</head>
<body>
<main class="stage">
  <div class="device">
    <div class="screen" id="screen">
      <div class="status"><span id="st-room">Prologo</span><span id="st-moves">Cap. 1 · Mosse 0</span></div>
      <div class="out" id="out" aria-live="polite"></div>

      <div class="drawer off" id="drawer">
      <div class="book">
        <div class="pager">
          <button type="button" class="chip" id="pg-prev" aria-label="Pagina precedente">◀</button>
          <span id="pg-label">Pag. 1 di 1</span>
          <button type="button" class="chip" id="pg-next" aria-label="Pagina successiva">▶</button>
        </div>
        <div class="refs">
          <button type="button" class="chip" id="ref-scheda" data-cmd="scheda">SCHEDA</button>
          <button type="button" class="chip" id="ref-mappa" data-cmd="mappa">MAPPA</button>
          <button type="button" class="chip" id="ref-salva" data-cmd="salva">SALVA</button>
          <button type="button" class="chip" id="ref-indizio" data-cmd="indizio">INDIZIO</button>
          <button type="button" class="chip" id="ref-aiuto" data-cmd="aiuto" aria-label="Aiuto">?</button>
          <button type="button" class="chip" id="ref-prefs" aria-label="Impostazioni" aria-expanded="false" aria-controls="prefs">Aa</button>
        </div>
      </div>

      <div class="prefs off" id="prefs">
        <div class="switch"><span id="lbl-mode">Schermo</span>
          <div class="seg" role="group" aria-labelledby="lbl-mode">
            <button type="button" id="mode-rullo" aria-pressed="true">Rullo</button>
            <button type="button" id="mode-pagina" aria-pressed="false">Pagina</button>
          </div>
        </div>
        <div class="switch"><span id="lbl-mot">Movimento</span>
          <div class="seg" role="group" aria-labelledby="lbl-mot">
            <button type="button" id="mot-on" aria-pressed="true">Sì</button>
            <button type="button" id="mot-off" aria-pressed="false">No</button>
          </div>
        </div>
        <div class="switch"><span id="lbl-size">Testo</span>
          <div class="seg" role="group" aria-labelledby="lbl-size">
            <button type="button" id="size-1" aria-pressed="true" aria-label="Testo normale">A</button>
            <button type="button" id="size-2" aria-pressed="false" aria-label="Testo grande">A+</button>
            <button type="button" id="size-3" aria-pressed="false" aria-label="Testo molto grande">A++</button>
          </div>
        </div>
        <div class="switch restart"><span>Ricomincia</span>
          <button type="button" class="chip" id="re-cap">Capitolo</button>
          <button type="button" class="chip" id="re-all">Da capo</button>
        </div>
        <p class="prefs-note">Su e-ink il movimento lascia aloni: lì conviene spegnerlo.</p>
      </div>

      <div class="rows" id="rows">
        <span class="lab">Rotta</span>
        <div class="chips" id="chips-dir"></div>
        <span class="lab">Azioni</span>
        <div class="chips" id="chips-verb">
          <button type="button" class="chip" id="v-esamina" data-verb="esamina">ESAMINA</button>
          <button type="button" class="chip" id="v-prendi" data-verb="prendi">PRENDI</button>
          <button type="button" class="chip" id="v-apri" data-verb="apri">APRI</button>
          <button type="button" class="chip" id="v-usa" data-verb="usa">USA</button>
          <button type="button" class="chip" id="v-dai" data-verb="dai">DAI</button>
          <button type="button" class="chip" id="v-parla" data-verb="parla">PARLA</button>
        </div>
        <span class="lab">Con te</span>
        <div class="bag" id="bag"></div>
      </div>

      </div>

      <form class="cmd" id="cmd-form" autocomplete="off">
        <label for="cmd-input">&gt;</label>
        <input id="cmd-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="scrivi un comando">
        <button type="button" class="chip" id="drawer-btn" aria-expanded="false" aria-controls="drawer">COMANDI</button>
      </form>
    </div>
  </div>

</main>

  function norm(s) {
    s = String(s).toLowerCase();
    s = s.replace(/[àá]/g, "a").replace(/[èé]/g, "e").replace(/[ìí]/g, "i").replace(/[òó]/g, "o").replace(/[ùú]/g, "u");
    s = s.replace(/\?/g, " aiuto ").replace(/['’`«»]/g, " ").replace(/[^a-z0-9 ]/g, " ");
    return s.replace(/\s+/g, " ").replace(/^ | $/g, "");
  }
  function tokens(s) {
    var raw = s.split(" "), out = [], i;
    if (raw.length === 1) { return raw; }
    for (i = 0; i < raw.length; i++) { if (raw[i] && STOP.indexOf(" " + raw[i] + " ") < 0) { out.push(raw[i]); } }
    return out.length ? out : raw;
  }

    if (who === "lodi") { return (r === "caserma" && (c === 2 || c === 3)) || (r === "cala" && c === 4); }
    if (who === "brandi" || who === "uomini") { return r === "cala" && c === 4; }
    return false;

  function present(id) {
    if (isNpc(id)) { return npcHere(id); }

      if (id === "quaderno") { return S.room === "lanterna" && S.f.sportello && S.loc.quaderno === "sportello"; }

    var sc = SCENERY[id], i;

    return false;
  }

  /* inizio del capitolo: un codice tenuto da parte, per RICOMINCIA CAPITOLO */
  var CHAP_KEY = "vialibera.capitolo", chapMem = "";
  function markChapter() { chapMem = encode(); try { localStorage.setItem(CHAP_KEY, chapMem); } catch (e) { /* resta in memoria */ } }
  function chapterStart() { var c = chapMem; try { c = localStorage.getItem(CHAP_KEY) || chapMem; } catch (e) { c = chapMem; } return decode(c || ""); }
  function restartChapter() {
    var o = chapterStart();
    if (!o || o.ch !== S.ch) { o = S.ch === 1 ? fresh() : null; }
    if (!o) { return [P("Non so dove comincia questo capitolo: la partita è stata ripresa da un codice. Puoi ricominciare da capo, oppure CARICA un codice salvato prima.")]; }

    if (S.end) { job = "Nessuno."; }

      sig.push("1-3  via libera, cala del Morto"); sig.push("2-1  aspettate"); sig.push("2-2  pericolo, tornate"); sig.push("3-1  scalo vecchio, «solo per i nostri»");

  function sleep() {

    if (S.ch !== 1) { return [P("Non è ora di dormire.")]; }
    if (!S.f.telefonato) { return [P("Non prima di aver chiamato Roma. Brandi non ama aspettare, e tu non ami dargli ragioni.")]; }
    S.moves++; S.f.notte = 1; setChapter(2);
    return [IMG("finestra21", "Le tre di notte, dalla camera 7"),
      P("Dormi vestita. Alle tre ti sveglia la luce.\nNon il solito lampo. Due, vicini. Buio. Poi uno. Buio lungo. E di nuovo: due, uno.\nIl guardiano è morto da tre giorni e il faro, dicono, va da solo. Qualcuno, lassù, non è d'accordo.\nQuando apri la finestra è tornato regolare. Non riprendi sonno."),
      CHAP(2)].concat(describe(false));
  }

    return [IMG("m_confessione", "Le chiavi di Elia"), P(S.f.nivesTradita ? "Posi la fotografia sul banco. Nives non la tocca.\n«L'ha già fatta vedere in giro, mi dicono. Qui le voci arrivano prima dei piroscafi.» Poi, perché non ha scelta: «Stanotte sono salita io. Due e uno: aspettate. Non sapevo che altro dire, a quelli in mare.»" : "Posi la fotografia sul banco, dalla parte della matita. Nives smette di asciugare.\n«Stanotte sono salita io. Due e uno: aspettate. Non sapevo che altro dire, a quelli in mare.»"),
      P("Elia portava gente di qua, di notte, con la luce. Chi poteva pagare e chi no. Da un anno qualcuno, a Roma, decideva quali barche arrivavano davvero. Elia l'ha capito leggendo un nome su un giornale dell'altra parte, nell'elenco dei fucilati. Era un uomo che aveva fatto sbarcare lui."),
      P("«Ha scritto tutto. Nomi, somme, notti. Il quaderno è nel faro, sotto la lente, dove la luce non guarda.» Ti mette in mano un [[mazzo]] di chiavi ancora tiepido di tasca. «La barca viene stanotte. Sopra c'è mio fratello.»"),

      P("La porta è aperta sulla notte, e nella porta c'è [[Kessel]]. Non ha l'ombrello. Ha una sigaretta.\n«L'ha trovato. Si vede da come tiene la borsa.»" + (S.f.kesselSa ? " Sorride. «E sa già della K. Bene: posso smettere di vendere spugne.»" : "") + " Non si avvicina. «Io lavoro per la terza bandiera, signora. Zanon mi vendeva dei nomi. Il suo capitano Brandi vendeva le persone. Stanotte sarà alla cala, con due uomini e il brigadiere.»"),
      P("Tira fuori una busta. «Mi dia il quaderno e faccia il segnale che vuole lui. Alla cala ci sarò anch'io, con più uomini dei suoi. Lei avrà un passaporto con un altro nome.»\nAspetta. [[ACCETTA|accetta]], oppure [[RIFIUTA|rifiuta]].")];

  function resolveKessel(accept) {
    var b;
    S.f.offerta = 0; S.moves++;

      if (!has("quaderno")) { S.f.offerta = 1; return [P("«Il quaderno, signora. Le parole le ho già.»")]; }

    } else {
      b = [P("Gli passi accanto. Ha un buon odore di tabacco straniero.\n«Come vuole», dice alle tue spalle. «Ma un segnale lo farà comunque. Lo ha già fatto una volta, mi risulta.»\nQuando ti volti, la porta è vuota.")];
    }

    return b.concat([CHAP(4), P("Le undici e venti. Quaranta minuti, quattro segnali, e tre persone che ne vogliono tre diversi.")]).concat(describe(false));

  var ENDINGS = {

            o = ((y * k + dy) * W2 + x * k) * 4;
            for (dx = 0; dx < k; dx++) { i = o + dx * 4; d[i] = v ? 17 : 241; d[i + 1] = v ? 17 : 240; d[i + 2] = v ? 17 : 234; d[i + 3] = 255; }
          }
        }
      }
      big[ck] = img;
    }
    ctx.putImageData(img, 0, 0);
  }
  var raw = {};
  function grid(id, f) { var key = id + "/" + (f % SC[id].n); if (!raw[key]) { raw[key] = render(id, f); } return raw[key]; }
  function make(id, cssW) {
    var sc = SC[id], c = sized(sc.w, sc.h, cssW), ctx = c.getContext("2d");
    c._paint = function (f) { blit(c, ctx, id + "/" + (f % sc.n), grid(id, f)); };
    c._paint(0);
    return c;
  }
  function makeMap(st, cssW) {
    var g = new Gfx(W, H), here = drawMap(g, st), c = sized(W, H, cssW), ctx = c.getContext("2d"), k = c.width / W, key;
    for (key in big) { if (key.indexOf("mappa") === 0) { delete big[key]; } }
    key = "mappa" + (++mapN);
    c._paint = function (f) {
      blit(c, ctx, key, g);
      if (PLACE[here]) { ctx.fillStyle = (f % 2) ? "#f1f0ea" : "#111111"; ctx.fillRect((PLACE[here][0] - 2) * k, (PLACE[here][1] - 2) * k, 5 * k, 5 * k); }
    };
    c._paint(0);
    return c;
  }

  return { make: make, makeMap: makeMap, scenes: SC, render: render, Gfx: Gfx, drawMap: drawMap };
})();

/* ==================================================================
   INTERFACCIA. Un ridisegno per turno. L'unica cosa che si muove sono
   le tavole: pochi fotogrammi, cambiati un paio di volte al secondo,
   e si possono fermare.
   ================================================================== */
if (typeof document !== "undefined") {
  (function () {
    var screen = document.getElementById("screen"), out = document.getElementById("out"), input = document.getElementById("cmd-input");
    var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    var prefs = { mode: "rullo", motion: !reduce, size: 1 }, turns = [], pos = 0, pending = null, atTop = true;
    var canCanvas = !!document.createElement("canvas").getContext;
    var DIR_LABEL = { nord: "NORD", sud: "SUD", est: "EST", ovest: "OVEST", su: "SU", giu: "GIÙ" };
    var anim = [], tick = 0, timer = null;

    try { var p = JSON.parse(localStorage.getItem("vialibera.prefs") || "null"); if (p && p.mode) { prefs.mode = p.mode; prefs.motion = !!p.motion; prefs.size = p.size === 2 || p.size === 3 ? p.size : 1; } } catch (e) { /* preferenze predefinite */ }

    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (text) { e.appendChild(document.createTextNode(text)); } return e; }
    function kw(label, word, cmd) {
      var k = el("span", "kw", label);
      if (cmd) { k.setAttribute("data-run", cmd); } else { k.setAttribute("data-kw", word); }
      k.setAttribute("role", "button"); k.setAttribute("tabindex", "0");
      return k;
    }
    function addText(parent, s) {
      var lines = s.split("\n"), i, re = /\[\[([^\]]+)\]\]/g, m, last, parts;
      for (i = 0; i < lines.length; i++) {
        if (i) { parent.appendChild(document.createElement("br")); }
        last = 0; re.lastIndex = 0;
        while ((m = re.exec(lines[i]))) {
          if (m.index > last) { parent.appendChild(document.createTextNode(lines[i].substring(last, m.index))); }
          parts = m[1].split("|");
          parent.appendChild(kw(parts[0], parts[0], parts[1]));
          last = m.index + m[0].length;
        }
        if (last < lines[i].length) { parent.appendChild(document.createTextNode(lines[i].substring(last))); }
      }
    }
    function avail() { return Math.max(160, out.clientWidth - 36); }
    function figure(canvas, cap) {
      var f = el("figure");
      if (canvas) { canvas.setAttribute("role", "img"); canvas.setAttribute("aria-label", cap || "Tavola"); f.appendChild(canvas); if (canvas._paint) { anim.push(canvas); } }
      if (cap) { f.appendChild(el("figcaption", "", cap)); }
      return f;
    }

    function renderTurn(turn) {
      var box = el("div", "turn"), i, j, q, b, e, c, parts, dl, ul, who, L;
      if (turn.cmd) { box.appendChild(el("p", "echo", "> " + turn.cmd)); }
      for (i = 0; i < turn.blocks.length; i++) {
        b = turn.blocks[i];
        if (b.t === "p" || b.t === "note" || b.t === "room") {
          e = el("p", b.t === "p" ? "" : b.t); addText(e, b.s); box.appendChild(e);
        } else if (b.t === "front") {
          e = el("div", "front"); e.appendChild(el("h2", "", b.s)); e.appendChild(el("span", "", b.sub)); box.appendChild(e);
        } else if (b.t === "chapter") {
          e = el("div", "chapter"); e.appendChild(el("span", "", b.n)); e.appendChild(el("h2", "", b.s)); box.appendChild(e);
        } else if (b.t === "prosa") {
          e = el("div", "prosa"); parts = b.s.split("\n\n");
          for (j = 0; j < parts.length; j++) { e.appendChild(el("p", "", parts[j])); }
          box.appendChild(e);
        } else if (b.t === "img") {
          box.appendChild(figure(canCanvas ? Pix.make(b.id, Math.min(avail(), Pix.scenes[b.id].w > 120 ? 480 : 240)) : null, b.cap));
        } else if (b.t === "map") {
          box.appendChild(figure(canCanvas ? Pix.makeMap(b, Math.min(avail(), 480)) : null, b.cap));
        } else if (b.t === "code") {
          box.appendChild(el("p", "code", b.s));
        } else if (b.t === "sheet") {
          e = el("div", "sheet");
          e.appendChild(figure(canCanvas ? Pix.make("ritratto", 128) : null, b.cap));
          who = el("div", "who"); who.appendChild(el("h2", "", b.name)); dl = el("dl");
          for (j = 0; j < b.rows.length; j++) { dl.appendChild(el("dt", "", b.rows[j][0])); dl.appendChild(el("dd", "", b.rows[j][1])); }
          who.appendChild(dl); e.appendChild(who); box.appendChild(e);
          for (j = 0; j < b.lists.length; j++) {
            L = b.lists[j];
            if (!L[1].length) { continue; }
            box.appendChild(el("p", "facts-title", L[0]));
            if (L[2]) {
              dl = el("dl", "people");
              for (q = 0; q < L[1].length; q++) { dl.appendChild(el("dt", "", L[1][q][0])); dl.appendChild(el("dd", "", L[1][q][1])); }
              box.appendChild(dl);
            } else {
              ul = el("ul", "facts"); for (q = 0; q < L[1].length; q++) { ul.appendChild(el("li", "", L[1][q])); }
              box.appendChild(ul);
            }
          }
        } else if (b.t === "end") {
          box.appendChild(el("p", "end", b.s));
        }
      }
      return box;
    }

    function renderPanel() {
      var st = PC.status(), ex = PC.exits(), inv = PC.inventory(), dir = document.getElementById("chips-dir"), bag = document.getElementById("bag"), i, b;
      var reading = prefs.mode === "pagina" && turns[pos].kind === "tavola";
      document.getElementById("st-room").textContent = reading ? "Prologo" : st.room;
      document.getElementById("st-moves").textContent = "Cap. " + st.ch + " · Mosse " + st.moves;
      screen.className = "screen " + prefs.mode + " t" + prefs.size + (reading ? " reading" : "");
      document.getElementById("pg-label").textContent = "Pag. " + (pos + 1) + " di " + turns.length;
      document.getElementById("pg-prev").disabled = pos === 0;
      document.getElementById("pg-next").disabled = pos === turns.length - 1;

      while (dir.firstChild) { dir.removeChild(dir.firstChild); }
      for (i = 0; i < ex.length; i++) { b = el("button", "chip", DIR_LABEL[ex[i]]); b.type = "button"; b.setAttribute("data-cmd", ex[i]); dir.appendChild(b); }
      dir.appendChild(el("span", "spacer"));
      b = el("button", "chip", "GUARDA"); b.type = "button"; b.setAttribute("data-cmd", "guarda"); dir.appendChild(b);

      while (bag.firstChild) { bag.removeChild(bag.firstChild); }
      for (i = 0; i < inv.length; i++) { if (i) { bag.appendChild(el("span", "sep", "·")); } bag.appendChild(kw(inv[i].label, inv[i].word)); }
      if (!inv.length) { bag.appendChild(document.createTextNode("niente")); }
    }

    function render() {
      var i, from, b;
      anim = [];
      while (out.firstChild) { out.removeChild(out.firstChild); }
      if (prefs.mode === "pagina") {
        out.appendChild(renderTurn(turns[pos]));
        if (pos < turns.length - 1) {
          b = el("button", "chip go turn-next", "Volta pagina ▶"); b.type = "button"; b.id = "turn-next";
          b.onclick = function () { goPage(pos + 1); };
          out.appendChild(b);
        }
        out.scrollTop = 0;
      } else {
        from = Math.max(0, turns.length - 24);
        for (i = from; i < turns.length; i++) { out.appendChild(renderTurn(turns[i])); }
        out.scrollTop = atTop ? 0 : out.scrollHeight;
      }
      renderPanel();
      runMotion();
    }

    function runMotion() {
      var i;
      if (timer) { clearInterval(timer); timer = null; }
      if (!prefs.motion || !anim.length) { for (i = 0; i < anim.length; i++) { anim[i]._paint(0); } return; }
      timer = setInterval(function () {
        tick++;
        for (var j = 0; j < anim.length; j++) { anim[j]._paint(tick); }
      }, 480);
    }

    var drawer = document.getElementById("drawer"), drawerBtn = document.getElementById("drawer-btn");
    function setDrawer(open) {
      drawer.className = open ? "drawer" : "drawer off";
      drawerBtn.textContent = open ? "CHIUDI" : "COMANDI";
      drawerBtn.className = open ? "chip on" : "chip";
      drawerBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    drawerBtn.onclick = function () { setDrawer(drawer.className.indexOf("off") >= 0); };

    function goPage(n) { pos = Math.max(0, Math.min(turns.length - 1, n)); render(); }
    function pushPrologue() {
      var pages = PC.prologue(), i, first = turns.length;
      for (i = 0; i < pages.length; i++) { turns.push({ cmd: null, blocks: pages[i], kind: "tavola" }); }
      return first;
    }
    function begin(forceNew) {
      var st = PC.start(forceNew);
      turns = []; pos = 0; atTop = true;
      if (!st.resumed) { pushPrologue(); }
      turns.push({ cmd: null, blocks: st.blocks, kind: "turno" });
      if (st.resumed) { pos = turns.length - 1; atTop = false; }
      render();
    }

    function setPending(verb) {
      var chips = document.getElementById("chips-verb").getElementsByTagName("button"), i;
      pending = verb;
      for (i = 0; i < chips.length; i++) { chips[i].className = chips[i].getAttribute("data-verb") === verb ? "chip on" : "chip"; }
      input.value = verb ? verb + " " : "";
      input.placeholder = verb ? "tocca una parola sottolineata" : "scrivi un comando";
    }

    function run(cmd) {
      var blocks, first, cut, i;
      cmd = String(cmd).replace(/^\s+|\s+$/g, "");
      if (!cmd) { return; }
      blocks = PC.exec(cmd);
      setPending(null);
      setDrawer(false);
      if (blocks.length && blocks[0].t === "restart") { begin(true); return; }
      atTop = false;
      if (blocks.length && blocks[0].t === "prologue") {
        first = pushPrologue();
        turns.push({ cmd: null, blocks: PC.look(), kind: "turno" });
        pos = prefs.mode === "pagina" ? first : turns.length - 1;
      } else {
        /* un cambio di capitolo apre una pagina nuova: prima si legge come finisce il vecchio */
        cut = -1;
        for (i = 1; i < blocks.length; i++) { if (blocks[i].t === "chapter") { cut = i; break; } }
        if (cut < 0) { turns.push({ cmd: cmd, blocks: blocks, kind: "turno" }); pos = turns.length - 1; }
        else {
          turns.push({ cmd: cmd, blocks: blocks.slice(0, cut), kind: "turno" });
          turns.push({ cmd: null, blocks: blocks.slice(cut), kind: "turno" });
          pos = prefs.mode === "pagina" ? turns.length - 2 : turns.length - 1;
        }
      }
      while (turns.length > 60) { turns.shift(); pos--; }
      render();
    }

    function tapWord(w) {
      if (PC.isDir(w)) { run(w); }
      else if (pending) { run(pending + " " + w); }
      else { run("esamina " + w); }
    }

    screen.onclick = function (ev) {
      var t = ev.target, cmd, verb;
      if (!t || !t.getAttribute) { return; }
      if (t.className === "kw") { if (t.getAttribute("data-run")) { run(t.getAttribute("data-run")); } else { tapWord(t.getAttribute("data-kw")); } return; }
      cmd = t.getAttribute("data-cmd"); verb = t.getAttribute("data-verb");
      if (cmd) { run(cmd); }
      else if (verb) { setPending(pending === verb ? null : verb); }
    };
    screen.onkeydown = function (ev) {
      var t = ev.target;
      if (t && t.className === "kw" && (ev.keyCode === 13 || ev.keyCode === 32)) { ev.preventDefault(); t.click(); }
    };
    document.getElementById("pg-prev").onclick = function () { goPage(pos - 1); };
    document.getElementById("pg-next").onclick = function () { goPage(pos + 1); };
    document.getElementById("cmd-form").onsubmit = function (ev) { ev.preventDefault(); run(input.value); };

    function setPref(key, val) {
      prefs[key] = val;
      try { localStorage.setItem("vialibera.prefs", JSON.stringify(prefs)); } catch (e) { /* non indispensabile */ }
      syncSwitch(); render();
    }
    function syncSwitch() {
      var pairs = [["mode-pagina", prefs.mode === "pagina"], ["mode-rullo", prefs.mode === "rullo"], ["mot-on", prefs.motion], ["mot-off", !prefs.motion], ["size-1", prefs.size === 1], ["size-2", prefs.size === 2], ["size-3", prefs.size === 3]], i;
      for (i = 0; i < pairs.length; i++) { document.getElementById(pairs[i][0]).setAttribute("aria-pressed", pairs[i][1] ? "true" : "false"); }
    }
    document.getElementById("mode-pagina").onclick = function () { setPref("mode", "pagina"); };
    document.getElementById("mode-rullo").onclick = function () { setPref("mode", "rullo"); };
    document.getElementById("mot-on").onclick = function () { setPref("motion", true); };
    document.getElementById("mot-off").onclick = function () { setPref("motion", false); };
    document.getElementById("size-1").onclick = function () { setPref("size", 1); };
    document.getElementById("size-2").onclick = function () { setPref("size", 2); };
    document.getElementById("size-3").onclick = function () { setPref("size", 3); };
    /* ricominciare: due tocchi, perché si perde la partita */
    var RE = [["re-cap", "Capitolo", "ricomincia capitolo"], ["re-all", "Da capo", "ricomincia"]];
    function disarm() {
      for (var i = 0; i < RE.length; i++) { var b = document.getElementById(RE[i][0]); b.removeAttribute("data-armed"); b.textContent = RE[i][1]; b.className = "chip"; }
    }
    function closePrefs() { var p = document.getElementById("ref-prefs"); document.getElementById("prefs").className = "prefs off"; p.className = "chip"; p.setAttribute("aria-expanded", "false"); }
    function armButton(r) {
      var b = document.getElementById(r[0]);
      b.onclick = function () {
        if (b.getAttribute("data-armed")) { disarm(); closePrefs(); run(r[2]); return; }
        disarm(); b.setAttribute("data-armed", "1"); b.textContent = "Sicuro? Tocca ancora"; b.className = "chip on";
      };
    }
    armButton(RE[0]); armButton(RE[1]);
    document.getElementById("ref-prefs").onclick = function () {
      var box = document.getElementById("prefs"), open = box.className.indexOf("off") >= 0;
      disarm();
      box.className = open ? "prefs" : "prefs off";
      this.className = open ? "chip on" : "chip";
      this.setAttribute("aria-expanded", open ? "true" : "false");
    };

    var resizeTimer = null, lastW = 0;
    window.onresize = function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { if (out.clientWidth !== lastW) { lastW = out.clientWidth; render(); } }, 250);
    };

    syncSwitch();
    begin(false);
    lastW = out.clientWidth;
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) { document.fonts.ready.then(function () { render(); }); }
  })();
}

</script>
