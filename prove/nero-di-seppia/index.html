<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nero di Seppia</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
/* Layout: una scrivania grigia con sopra un e-reader. Dentro lo schermo solo carta e inchiostro:
   il prologo e' impaginato come un romanzo illustrato di fine Ottocento, il gioco come un terminale.
   Tema unico per scelta: e' la resa di un pannello e-ink. */
:root {
  color-scheme: light;
  --desk: #c7cbc9;
  --desk-ink: #23282a;
  --bezel: #1d2022;
  --paper: #f1f0ea;
  --ink: #111111;
  --ink-soft: #565a5b;
  --mono: "IBM Plex Mono", "Courier New", Courier, monospace;
  --serif: "Old Standard TT", "Century Schoolbook", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--desk); color: var(--desk-ink); font-family: var(--mono); font-size: 14.5px; line-height: 1.5; }

.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }

.demo-bar { width: 100%; max-width: 600px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.demo-bar h1 { font-family: var(--serif); font-weight: 700; font-size: 27px; line-height: 1; margin: 0; letter-spacing: 3px; text-transform: uppercase; }
.demo-bar p { margin: 4px 0 0; font-size: 12px; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.seg { display: flex; }
.seg button { font: 600 12px/1 var(--mono); color: var(--desk-ink); background: transparent; border: 2px solid var(--desk-ink); padding: 0 10px; min-height: 32px; cursor: pointer; border-radius: 0; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--desk-ink); color: var(--desk); }

.device { flex: 1 1 auto; width: 100%; max-width: 600px; min-height: 600px; max-height: 900px; display: flex; background: var(--bezel); padding: 22px 22px 40px; border-radius: 18px; }
.screen { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); }

.status { display: flex; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 16px; }
.status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- pagina ---------- */
.out { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 14px 16px 6px; }
.out p { margin: 0 0 10px; max-width: 64ch; }
.out .room { font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; }
.out .echo { font-weight: 600; margin: 0 0 8px; }
.out .note { color: var(--ink-soft); font-size: 13px; }
.out .turn + .turn { border-top: 1px dashed var(--ink); padding-top: 12px; margin-top: 6px; }
.kw { font-weight: 600; border-bottom: 2px dotted var(--ink); cursor: pointer; }

.front { text-align: center; margin: 2px 0 10px; }
.front h2 { font-family: var(--serif); font-size: 30px; letter-spacing: 5px; text-transform: uppercase; margin: 0; line-height: 1.1; text-wrap: balance; }
.front span { display: block; font-family: var(--serif); font-style: italic; font-size: 15px; margin-top: 2px; }
.prosa p { font-family: var(--serif); font-size: 17.5px; line-height: 1.46; max-width: 60ch; margin: 0 0 9px; }
.prosa p:first-child::first-letter { float: left; font-weight: 700; font-size: 3.05em; line-height: 0.86; padding: 3px 7px 0 0; }

figure { margin: 2px 0 12px; }
figure canvas { display: block; margin: 0 auto; border: 2px solid var(--ink); max-width: 100%; }
figcaption { font-family: var(--serif); font-style: italic; font-size: 14px; text-align: center; margin-top: 5px; }

.sheet { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: flex-start; margin-bottom: 8px; }
.sheet figure { flex: 0 0 auto; margin: 0; }
.sheet figure canvas { border: 0; }
.sheet figcaption { max-width: 124px; font-size: 12.5px; line-height: 1.25; }
.sheet .who { flex: 1 1 240px; min-width: 0; }
.sheet h2 { font-family: var(--serif); font-size: 24px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 6px; line-height: 1.1; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.sheet dl { margin: 0; font-size: 13px; line-height: 1.4; }
.sheet dt { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin-top: 6px; }
.sheet dd { margin: 0; }
.facts { margin: 0 0 8px; padding: 8px 0 0 18px; border-top: 1px solid var(--ink); font-size: 13px; }
.facts-title { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin: 0 0 -4px; }
.end { font-family: var(--serif); font-style: italic; font-size: 20px; text-align: center; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 8px 0; margin: 14px 0 10px; }
.turn-next { display: block; width: 100%; margin: 6px 0 8px; }

/* ---------- comandi ---------- */
.chip { font: 600 12.5px/1 var(--mono); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 0; padding: 0 8px; min-width: 38px; min-height: 36px; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--paper); }
.chip:disabled { border-style: dotted; color: var(--ink-soft); cursor: default; }
.chip.go { min-height: 42px; font-size: 14px; }

.book { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 16px; border-top: 2px solid var(--ink); }
.pager { display: flex; align-items: center; gap: 6px; }
.pager span { font-size: 12px; min-width: 88px; text-align: center; }
.refs { display: flex; gap: 6px; }
.screen.rullo .pager { visibility: hidden; }

.rows { display: grid; grid-template-columns: 58px 1fr; gap: 6px 8px; align-items: center; padding: 0 16px; }
.rows .lab { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; }
.chips .spacer { flex: 1 1 auto; }
.bag { font-size: 13.5px; line-height: 1.9; }
.bag .sep { padding: 0 7px; color: var(--ink-soft); }

.cmd { display: flex; align-items: center; gap: 8px; padding: 6px 16px 14px; }
.cmd label { font-weight: 600; font-size: 18px; }
.cmd input { flex: 1 1 auto; min-width: 0; font: 400 16px/1.2 var(--mono); color: var(--ink); background: var(--paper); border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; padding: 6px 2px; }
.cmd input::placeholder { color: var(--ink-soft); }
.screen.reading .rows, .screen.reading .cmd { display: none; }
.screen.reading .book { padding-bottom: 14px; }

button:focus-visible, input:focus-visible, .kw:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.seg button:focus-visible { outline-color: var(--desk-ink); }

.foot { width: 100%; max-width: 600px; margin: 0; font-size: 12px; }

@media (max-width: 640px) {
  .stage { padding: 0; gap: 0; }
  .demo-bar { padding: 10px 16px; }
  .demo-bar h1 { font-size: 22px; }
  .device { padding: 0; border-radius: 0; max-height: none; min-height: 560px; }
  .foot { padding: 8px 16px; }
  .rows { grid-template-columns: 1fr; gap: 2px; }
  .rows .lab { margin-top: 4px; }
}
</style>
</head>
<body>
<main class="stage">
  <header class="demo-bar">
    <div>
      <h1>Nero di Seppia</h1>
      <p>Seconda prova · avventura testuale per e-reader</p>
    </div>
    <div class="switch"><span id="lbl-mode">Schermo</span>
      <div class="seg" role="group" aria-labelledby="lbl-mode">
        <button type="button" id="mode-pagina" aria-pressed="true">Pagina</button>
        <button type="button" id="mode-rullo" aria-pressed="false">Rullo</button>
      </div>
    </div>
  </header>

  <div class="device">
    <div class="screen" id="screen">
      <div class="status"><span id="st-room">Prologo</span><span id="st-moves">Mosse 0</span></div>
      <div class="out" id="out" aria-live="polite"></div>

      <div class="book">
        <div class="pager">
          <button type="button" class="chip" id="pg-prev" aria-label="Pagina precedente">◀</button>
          <span id="pg-label">Pag. 1 di 1</span>
          <button type="button" class="chip" id="pg-next" aria-label="Pagina successiva">▶</button>
        </div>
        <div class="refs">
          <button type="button" class="chip" id="ref-scheda" data-cmd="scheda">SCHEDA</button>
          <button type="button" class="chip" id="ref-mappa" data-cmd="mappa">MAPPA</button>
          <button type="button" class="chip" id="ref-aiuto" data-cmd="aiuto" aria-label="Aiuto">?</button>
        </div>
      </div>

      <div class="rows" id="rows">
        <span class="lab">Rotta</span>
        <div class="chips" id="chips-dir"></div>
        <span class="lab">Azioni</span>
        <div class="chips" id="chips-verb">
          <button type="button" class="chip" id="v-esamina" data-verb="esamina">ESAMINA</button>
          <button type="button" class="chip" id="v-prendi" data-verb="prendi">PRENDI</button>
          <button type="button" class="chip" id="v-apri" data-verb="apri">APRI</button>
          <button type="button" class="chip" id="v-usa" data-verb="usa">USA</button>
          <button type="button" class="chip" id="v-dai" data-verb="dai">DAI</button>
          <button type="button" class="chip" id="v-parla" data-verb="parla">PARLA</button>
        </div>
        <span class="lab">Con te</span>
        <div class="bag" id="bag"></div>
      </div>

      <form class="cmd" id="cmd-form" autocomplete="off">
        <label for="cmd-input">&gt;</label>
        <input id="cmd-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="scrivi un comando, poi Invio">
      </form>
    </div>
  </div>

  <p class="foot">Si gioca scrivendo, oppure toccando un'azione e poi una parola sottolineata. Le tavole sono calcolate dal codice, senza file immagine.</p>
</main>

<script>
/* ==================================================================
   MOTORE DI GIOCO. Non tocca il DOM: riceve una stringa e restituisce
   una lista di blocchi (testo, titolo, tavola, mappa, scheda).
   ================================================================== */
var PC = (function () {
  var SAVE_KEY = 'nerodiseppia.v1';
  var S;

  var ROOM_NAME = { cuccetta: 'La tua cuccetta', corridoio: 'Corridoio', ponte: 'Ponte di comando', macchine: 'Sala macchine', stagna: 'Camera stagna', fondale: 'Fondale' };
  var EXITS = {
    cuccetta: { giu: 'corridoio' },
    corridoio: { prua: 'ponte', poppa: 'macchine', su: 'cuccetta', giu: 'stagna' },
    ponte: { poppa: 'corridoio' },
    macchine: { prua: 'corridoio' },
    stagna: { su: 'corridoio', fuori: 'fondale' },
    fondale: { dentro: 'stagna' }
  };
  var DIR_ORDER = ['prua', 'poppa', 'su', 'giu', 'dentro', 'fuori'];
  var ADJ = [['cuccetta', 'corridoio'], ['corridoio', 'ponte'], ['corridoio', 'macchine'], ['corridoio', 'stagna'], ['stagna', 'fondale']];
  var ITEMS = ['lume', 'bulino', 'taccuino', 'gallette', 'elmo', 'manovella'];

  function fresh() {
    return { room: 'cuccetta', moves: 0, visited: { cuccetta: 1 },
      loc: { bulino: 'inv', taccuino: 'inv', lume: 'cuccetta', gallette: 'ponte', elmo: 'ponte', manovella: 'polpo' },
      f: { botola: 0, spuntato: 0, giornale: 0, oblo: 0, polpo: 0, nutrito: 0, indossato: 0, portello: 0, fine: 0 } };
  }

  /* ---------- parser ---------- */
  var STOP = ' il lo la i gli le l un uno una del dello della dei degli delle dell al allo alla ai agli alle all nel nello nella nell sul sullo sulla sull con col di da dal dalla per verso a ad in mio mia ';
  var DIRS = { prua: 'prua', avanti: 'prua', poppa: 'poppa', indietro: 'poppa', dietro: 'poppa',
    su: 'su', sali: 'su', salgo: 'su', alto: 'su', giu: 'giu', scendi: 'giu', scendo: 'giu', basso: 'giu',
    fuori: 'fuori', esci: 'fuori', esco: 'fuori', dentro: 'dentro', entra: 'dentro', rientra: 'dentro', rientro: 'dentro' };
  var VERBS = {
    guarda: 'guarda', g: 'guarda', l: 'guarda', osserva: 'guarda', descrivi: 'guarda',
    esamina: 'esamina', x: 'esamina', ispeziona: 'esamina', controlla: 'esamina', studia: 'esamina',
    leggi: 'leggi', sfoglia: 'leggi',
    prendi: 'prendi', raccogli: 'prendi', piglia: 'prendi', afferra: 'prendi', stacca: 'prendi', ripesca: 'prendi',
    lascia: 'lascia', posa: 'lascia', molla: 'lascia',
    inventario: 'inventario', inv: 'inventario', i: 'inventario', zaino: 'inventario', tasche: 'inventario',
    apri: 'apri', forza: 'apri', chiudi: 'chiudi',
    usa: 'usa', utilizza: 'usa', infila: 'usa', adopera: 'usa', gira: 'usa', avvita: 'usa', spingi: 'usa', tira: 'usa',
    dai: 'dai', offri: 'dai', porgi: 'dai', lancia: 'dai', dona: 'dai',
    parla: 'parla', saluta: 'parla', chiedi: 'parla', chiama: 'parla', grida: 'parla',
    indossa: 'indossa', metti: 'indossa', vesti: 'indossa', togli: 'togli', sfila: 'togli',
    accendi: 'accendi', spegni: 'spegni', mangia: 'mangia', assaggia: 'mangia',
    vai: 'vai', va: 'vai', vado: 'vai', cammina: 'vai', corri: 'vai', torna: 'vai',
    mappa: 'mappa', m: 'mappa', cartina: 'mappa', spaccato: 'mappa',
    scheda: 'scheda', chi: 'scheda', personaggio: 'scheda', io: 'scheda',
    aiuto: 'aiuto', help: 'aiuto', comandi: 'aiuto',
    prologo: 'prologo', ricomincia: 'ricomincia', restart: 'ricomincia', salva: 'salva', aspetta: 'aspetta', z: 'aspetta', dormi: 'aspetta'
  };
  var NOUNS = {
    lume: 'lume', lanterna: 'lume', lampada: 'lume', luce: 'lume',
    bulino: 'bulino', taccuino: 'taccuino', quaderno: 'taccuino', schizzi: 'taccuino',
    sportello: 'botola', botola: 'botola', porta: 'botola', fessura: 'botola', anello: 'botola',
    branda: 'branda', letto: 'branda', mensola: 'branda', cuccetta: 'branda', tubi: 'branda',
    scritta: 'scritta', gesso: 'scritta', paratia: 'scritta', muro: 'scritta',
    lampade: 'lampade', timone: 'timone', ruota: 'timone', poltrona: 'poltrona', sedia: 'poltrona',
    tavolo: 'tavolo', carte: 'tavolo', giornale: 'giornale', diario: 'giornale', registro: 'giornale', libro: 'giornale',
    elmo: 'elmo', casco: 'elmo', biscottiera: 'elmo',
    gallette: 'gallette', galletta: 'gallette', biscotti: 'gallette', biscotto: 'gallette',
    oblo: 'oblo', finestra: 'oblo', vetro: 'oblo',
    polpo: 'polpo', piovra: 'polpo', bestia: 'polpo', animale: 'polpo', tentacolo: 'polpo',
    manovella: 'manovella', quadro: 'quadro', valvole: 'quadro', bielle: 'motore', macchine: 'motore', motore: 'motore', acqua: 'acqua',
    scafandro: 'scafandro', tuta: 'scafandro', muta: 'scafandro', portello: 'portello', perno: 'portello', ganci: 'ganci', gancio: 'ganci',
    scala: 'scala', scaletta: 'scala',
    malanotte: 'relitto', veliero: 'relitto', relitto: 'relitto', nave: 'relitto', brigantino: 'relitto',
    impronte: 'impronte', orme: 'impronte', lampreda: 'lampreda', sommergibile: 'lampreda', scafo: 'lampreda',
    fango: 'fango', fondale: 'fango', capitano: 'gente', gorgo: 'gente', equipaggio: 'gente', nostromo: 'gente',
    mappa: 'mappa', scheda: 'scheda'
  };
  var SCENERY = { botola: ['cuccetta', 'corridoio'], branda: ['cuccetta'], scritta: ['corridoio'], lampade: ['corridoio'],
    timone: ['ponte'], poltrona: ['ponte'], tavolo: ['ponte'], giornale: ['ponte'], oblo: ['ponte'],
    polpo: ['macchine'], quadro: ['macchine'], motore: ['macchine'], acqua: ['macchine', 'stagna', 'fondale'],
    scafandro: ['stagna'], portello: ['stagna', 'fondale'], ganci: ['stagna'], scala: ['corridoio', 'stagna', 'cuccetta'],
    relitto: ['fondale'], impronte: ['fondale'], fango: ['fondale'], lampreda: '*', gente: '*' };

  function norm(s) {
    s = String(s).toLowerCase();
    s = s.replace(/[àá]/g, 'a').replace(/[èé]/g, 'e').replace(/[ìí]/g, 'i').replace(/[òó]/g, 'o').replace(/[ùú]/g, 'u');
    s = s.replace(/\?/g, ' aiuto ').replace(/['’`«»]/g, ' ').replace(/[^a-z0-9 ]/g, ' ');
    return s.replace(/\s+/g, ' ').replace(/^ | $/g, '');
  }
  function tokens(s) {
    var raw = s.split(' '), out = [], i;
    if (raw.length === 1) { return raw; }
    for (i = 0; i < raw.length; i++) { if (raw[i] && STOP.indexOf(' ' + raw[i] + ' ') < 0) { out.push(raw[i]); } }
    return out.length ? out : raw;
  }

  /* ---------- stato del mondo ---------- */
  function has(id) { return S.loc[id] === 'inv'; }
  function isItem(id) { for (var i = 0; i < ITEMS.length; i++) { if (ITEMS[i] === id) { return true; } } return false; }
  function dark() { return S.room === 'macchine' && !has('lume'); }
  function present(id) {
    if (isItem(id)) {
      if (has(id) || S.loc[id] === S.room) { return true; }
      if (id === 'manovella') { return (S.loc.manovella === 'polpo' && S.room === 'macchine') || (S.loc.manovella === 'perno' && S.room === 'stagna'); }
      if (id === 'elmo') { return S.loc.elmo === 'worn'; }
      return false;
    }
    var sc = SCENERY[id];
    if (!sc) { return false; }
    if (sc === '*') { return true; }
    for (var i = 0; i < sc.length; i++) { if (sc[i] === S.room) { return true; } }
    return false;
  }

  /* ---------- blocchi ---------- */
  function P(s) { return { t: 'p', s: s }; }
  function NOTE(s) { return { t: 'note', s: s }; }
  function IMG(id, cap) { return { t: 'img', id: id, cap: cap }; }

  function describe(withImage) {
    var b = [{ t: 'room', s: ROOM_NAME[S.room] }], r = S.room, d = '', t;
    if (r === 'cuccetta') {
      d = 'Una mensola per dormire e un\'altra, più stretta, per pentirsene: ti hanno dato il loculo sopra i tubi del vapore. Il pavimento pende verso poppa. ';
      if (S.loc.lume === 'cuccetta') { d += 'Alla parete oscilla un [[lume]] a olio, acceso per puro spirito di contraddizione. '; }
      d += S.f.botola ? 'Lo [[sportello]] nel pavimento è aperto: [[giù]].' : 'Nel pavimento c\'è lo [[sportello]] che scende in corridoio.';
    } else if (r === 'corridoio') {
      d = 'Largo quanto un uomo che trattiene il fiato. Le [[lampade]] sono morte tutte tranne una, che ci sta pensando. Sulla paratia qualcuno ha lasciato una [[scritta]] col gesso.\nA [[prua]] c\'è il ponte di comando; a [[poppa]] la sala macchine, da cui non arriva nessun rumore, ed è questo il rumore che ti preoccupa. Una scaletta sale alla tua cuccetta ([[su]]), una botola scende alla camera stagna ([[giù]]).';
    } else if (r === 'ponte') {
      d = 'Il [[timone]] gira piano da solo, come chi finge di avere da fare. La [[poltrona]] del capitano è vuota. Sul tavolo delle carte ';
      var e = S.loc.elmo === 'ponte', g = S.loc.gallette === 'ponte';
      if (e && g) { d += 'ci sono il [[giornale]] di bordo e l\'[[elmo]] di uno scafandro, pieno di [[gallette]]: qualcuno lo usava come biscottiera.'; }
      else if (e) { d += 'ci sono il [[giornale]] di bordo e l\'[[elmo]] di uno scafandro, vuoto.'; }
      else if (g) { d += 'ci sono il [[giornale]] di bordo e un mucchietto di [[gallette]].'; }
      else { d += 'resta il [[giornale]] di bordo.'; }
      d += ' Davanti a te, grande come una ruota di carro, l\'[[oblò]].\nIl corridoio è a [[poppa]].';
    } else if (r === 'macchine') {
      if (dark()) {
        d = 'Buio, e uno sciacquio. Qualcosa, qui dentro, si è spostato quando sei entrato. Senza una luce non fai un altro passo.\nIl corridoio è a [[prua]].';
      } else {
        if (!S.f.polpo) { S.f.polpo = 1; b.push(IMG('polpo', 'Tav. V — Il nuovo macchinista')); }
        d = 'Le bielle sono ferme a metà gesto. C\'è un palmo d\'[[acqua]] sul pavimento e, seduto sul [[quadro]] delle valvole con l\'aria di chi ha già sporto reclamo, un [[polpo]] grosso come un cane da pastore';
        if (!S.f.nutrito) { d += '. Con un tentacolo tiene stretta una [[manovella]] di ottone.'; }
        else { d += ', che digerisce.' + (S.loc.manovella === 'macchine' ? ' La [[manovella]] è nell\'acqua, ai suoi piedi. Per così dire.' : ''); }
        d += '\nIl corridoio è a [[prua]].';
      }
    } else if (r === 'stagna') {
      d = 'Una stanza di ferro pensata per riempirsi d\'acqua, ' + (S.f.portello ? 'e adesso lo fa benissimo. ' : 'cosa che per ora non fa. ');
      d += S.f.indossato ? 'Sei dentro lo [[scafandro]], e lo scafandro è dentro la stanza. ' : 'Alla parete è appeso uno [[scafandro]], l\'ultimo di sei: gli altri [[ganci]] sono vuoti. ';
      d += S.f.portello ? 'Il [[portello]] esterno è aperto sul buio: [[fuori]].' : 'Nel pavimento c\'è il [[portello]] esterno, con un perno quadrato dove dovrebbe stare una manovella.';
      d += '\nLa scala torna [[su]].';
    } else if (r === 'fondale') {
      if (withImage) { b.push(IMG('relitto', 'Tav. VI — La «Malanotte»')); }
      d = 'Il [[fango]] si alza a ogni passo e ricade piano, come neve che ci ha ripensato. Dietro di te la [[Lampreda]], coricata su un fianco. Davanti, nel fanale dell\'elmo, la [[Malanotte]]: intera, gli alberi in piedi, le vele ancora serrate ai pennoni, come se trent\'anni fossero stati una sosta.\nSei paia di [[impronte]] di piombo vanno verso la sua fiancata. Nessuna torna.\nIl portello è alle tue spalle: [[dentro]].';
    }
    b.push(P(d));
    return b;
  }

  function prologue() {
    return [
      [{ t: 'front', s: 'Nero di Seppia', sub: 'Prologo, in quattro tavole' },
        IMG('porto', 'Tav. I — Porto Scuro, novembre 1887'),
        { t: 'prosa', s: 'A Porto Scuro piove di traverso undici mesi l\'anno. Il dodicesimo c\'è la nebbia.\n\nTi chiami Tullio Vespro, hai ventitré anni e incidi il legno per la «Gazzetta Illustrata»: navi che arrivano, navi che partono, ogni tanto un naufragio, che viene meglio. Mastro Zeno dice che hai una buona mano e una pessima sorte. Sulla mano ha ragione.' }],
      [IMG('lampreda', 'Tav. II — La «Lampreda» all\'ormeggio'),
        { t: 'prosa', s: 'Poi è arrivata la lettera. Un certo capitano Gorgo cercava un incisore per documentare «un\'impresa scientifica di breve durata e sicuro ritorno». Mastro Zeno l\'ha letta due volte, si è rotto una gamba con ammirevole tempismo e ha mandato te.\n\nLa «Lampreda» aspettava in fondo al molo vecchio, legata corta come un cane che morde: trenta metri di ferro chiodato, senza un solo albero. «Non galleggia», hai detto. «Non è il suo mestiere», ha risposto Gorgo.' }],
      [IMG('discesa', 'Tav. III — La discesa'),
        { t: 'prosa', s: 'Siete scesi all\'alba. A venti braccia il mare era verde, a cinquanta era blu, a cento ha smesso di essere un colore ed è diventato un\'opinione.\n\nGorgo guardava dall\'oblò senza battere le palpebre e ripeteva un nome solo: «Malanotte». Un brigantino, hai capito, andato a fondo trent\'anni fa con un carico che nessun registro ha mai avuto il coraggio di elencare. Tu incidevi. Ti pagano a tavola.' }],
      [IMG('oblo', 'Tav. IV — Qualcosa, là fuori'),
        { t: 'prosa', s: 'Al terzo giorno qualcosa ha bussato allo scafo. Da fuori. Tre colpi, educati.\n\nRicordi il capitano che sorrideva per la prima volta, le lampade che si spegnevano una dopo l\'altra, e un rumore come di una cattedrale che si siede. Poi più niente.\n\nTi svegli nella tua cuccetta. La «Lampreda» è ferma, storta e molto silenziosa. Qualcosa gocciola. Non sei sicuro che sia acqua.' }]
    ];
  }

  function sheet() {
    var cond, scopo, facts = [];
    if (S.room === 'fondale') { cond = 'Sott\'acqua, a centoquaranta braccia. Respira, il che è già molto.'; }
    else if (S.f.indossato) { cond = 'Chiuso in quaranta chili di rame, tela e piombo.'; }
    else { cond = 'Asciutto. Per ora.'; }
    if (S.f.fine) { scopo = 'Seguire le impronte. Oppure trovare un ottimo motivo per non farlo.'; }
    else if (S.f.giornale || S.visited.stagna) { scopo = 'Uscire dalla «Lampreda». Preferibilmente respirando.'; }
    else if (S.f.botola) { scopo = 'Capire perché a bordo non si sente più nessuno.'; }
    else { scopo = 'Uscire da questa cuccetta.'; }

    facts.push(S.f.giornale ? 'La «Lampreda» è ferma sul fondo, a centoquaranta braccia.' : 'La «Lampreda» è ferma, storta e silenziosa.');
    if (S.f.spuntato) { facts.push('Un bulino da otto lire non è una leva. Funziona una volta sola.'); }
    if (S.visited.corridoio) { facts.push('L\'equipaggio ha scritto «Torniamo subito». Non ha scritto quando.'); }
    if (S.f.giornale) { facts.push('Gorgo ha trovato la «Malanotte». O la «Malanotte» ha trovato lui.'); }
    if (S.f.oblo) { facts.push('Là fuori c\'è un veliero. E qualcosa di lungo, che non ha fretta.'); }
    if (S.f.polpo) { facts.push(S.f.nutrito ? 'I polpi apprezzano le gallette più di te.' : 'In sala macchine comanda un polpo. Ha una manovella e non la presta.'); }
    if (S.f.fine) { facts.push('Sei paia di impronte vanno verso il relitto. Nessuna torna.'); }

    return [{ t: 'sheet', name: 'Tullio Vespro', cap: 'Autoritratto, a memoria e senza specchio',
      rows: [['Età', '23 anni, portati con apprensione'],
        ['Mestiere', 'Apprendista incisore, bottega di mastro Zeno, Porto Scuro'],
        ['Incarico', 'Illustrare la spedizione della «Lampreda» per la «Gazzetta Illustrata»'],
        ['Paga', 'A tavola consegnata. Finora: nessuna'],
        ['Debiti', 'Tre mesi d\'affitto, un bulino da otto lire, una cena'],
        ['Sa nuotare', 'No'],
        ['Condizione', cond],
        ['Scopo', scopo]],
      facts: facts }];
  }

  function mapBlock() {
    var v = {}, id;
    for (id in S.visited) { if (S.visited.hasOwnProperty(id)) { v[id] = 1; } }
    return [{ t: 'map', visited: v, room: S.room, polpo: S.f.polpo, suit: !S.f.indossato, cap: 'Spaccato della «Lampreda», per quel che ne hai visto' }];
  }

  /* ---------- azioni ---------- */
  function go(dir) {
    var ex = EXITS[S.room], to = ex[dir], d, n = 0, only;
    if (!to && dir === 'fuori') { for (d in ex) { if (ex.hasOwnProperty(d)) { n++; only = d; } } if (n === 1) { dir = only; to = ex[dir]; } }
    if (!to) { return [P('Da quella parte c\'è solo ferro.')]; }
    if (S.room === 'cuccetta' && !S.f.botola) { return [P('Lo sportello è incastrato. Non si scende.')]; }
    if (S.room === 'stagna' && dir === 'su') {
      if (S.f.portello) { return [P('La camera è allagata e il portello interno non si apre finché c\'è acqua. Ce n\'è.')]; }
      if (S.f.indossato) { return [P('Con quaranta chili di rame e piombo addosso, la scala è fuori discussione.')]; }
    }
    if (S.room === 'stagna' && dir === 'fuori' && !S.f.portello) { return [P('Il portello esterno è chiuso. Sul perno manca la manovella.')]; }
    S.room = to; S.moves++;
    var first = !S.visited[to];
    S.visited[to] = 1;
    if (to === 'fondale' && !S.f.fine) {
      S.f.fine = 1;
      return describe(true).concat([{ t: 'end', s: 'Fine della prima tavola' },
        NOTE('La prova finisce qui. Puoi ancora guardarti intorno, aprire la SCHEDA o la MAPPA, rileggere il PROLOGO, oppure scrivere RICOMINCIA.')]);
    }
    return describe(first);
  }

  function readLog() {
    S.f.giornale = 1; S.moves++;
    return [P('L\'ultima pagina è di ieri, nella grafia a punta del capitano:'),
      P('«Giorno 3. Profondità 140 braccia. Trovata. Lei ci ha visti per prima.\nL\'equipaggio insiste per uscire a salutare. Ho dato il permesso: non si discute con chi ha già deciso.\nNota: l\'incisore dorme. Lasciarlo dormire. Qualcuno dovrà pur disegnarlo.»')];
  }

  function examine(id) {
    switch (id) {
      case 'lume': return [P('Un lume a olio da marina, con la gabbia di ottone. Fa una luce gialla e testarda.')];
      case 'bulino': return [P(S.f.spuntato ? 'Il tuo bulino migliore. Era. Adesso ha la punta storta come un\'opinione di mastro Zeno.' : 'Il tuo bulino migliore: acciaio di Sheffield, manico di bosso. Otto lire, non ancora pagate.')];
      case 'taccuino': return [P('I tuoi schizzi: la «Lampreda» all\'ormeggio, il capitano di profilo, un gabbiano venuto male. Le ultime pagine sono bianche. Per ora.')];
      case 'botola':
        if (S.room === 'corridoio') { return [P('Una botola con una scala di ferro che scende alla camera stagna.')]; }
        return [P(S.f.botola ? 'Aperto, e non si richiuderà mai più.' : 'Lo sportello da cui si scende in corridoio. Lo scafo si è storto e lui con lo scafo: è incastrato. Resta una fessura dove passerebbe una lama.')];
      case 'branda': return [P('Dormirci era difficile anche quando il pavimento era in piano.')];
      case 'scritta': return [P('«TORNIAMO SUBITO». La calligrafia è del nostromo. Il gesso è ancora per terra, spezzato in due.')];
      case 'lampade': return [P('Una sola resiste. Ogni tanto sfarfalla, giusto per tenerti sveglio.')];
      case 'timone': return [P('Lo fermi con una mano. Appena lo lasci, ricomincia.')];
      case 'poltrona': return [P('Cuoio consumato. È ancora tiepida. Preferiresti di no.')];
      case 'tavolo': return [P('Carte nautiche. L\'ultima rotta finisce in un punto dove qualcuno ha premuto la matita fino a bucare il foglio.')];
      case 'giornale': return readLog();
      case 'elmo': return [P('Rame battuto, tre vetri, un collare a vite. ' + (S.loc.gallette === 'ponte' && S.loc.elmo === 'ponte' ? 'Dentro, gallette.' : 'Odora ancora di gallette.'))];
      case 'gallette': return [P('Gallette da marinaio, dure come la vita che le ha prodotte. Qualcuno ci ha inciso le iniziali, per non confonderle.')];
      case 'oblo':
        S.f.oblo = 1;
        return [IMG('oblo', 'Tav. IV — Qualcosa, là fuori'), P('Il fanale di prua illumina dieci metri di niente. Oltre, appoggiata sul fondo come una bestia che dorme, la sagoma di un veliero. E tra voi e lei, qualcosa di lungo che si sposta senza fretta.')];
      case 'polpo':
        if (S.f.nutrito) { return [P('Ha cambiato colore: adesso è del grigio soddisfatto di un notaio dopo pranzo. Ti ignora con metodo.')]; }
        return [IMG('polpo', 'Tav. V — Il nuovo macchinista'), P('Ti guarda con un occhio a fessura, e in quell\'occhio c\'è più pazienza che in tutta Porto Scuro. Non ha l\'aria di voler mollare la manovella. Ha l\'aria di avere fame.')];
      case 'manovella':
        if (S.loc.manovella === 'polpo') { return [P('Ottone, con un innesto quadrato. Il polpo la tiene come si tiene un argomento vincente.')]; }
        if (S.loc.manovella === 'perno') { return [P('Avvitata sul perno. Ha fatto il suo dovere.')]; }
        return [P('Ottone, con un innesto quadrato. È fredda e un po\' viscida. Non indaghi.')];
      case 'quadro': return [P('Volantini, manometri, targhette in tedesco. Tutte le lancette sono a zero, tranne una che non vuoi capire.')];
      case 'motore': return [P('Fermo. Non rotto: fermo. Come se avesse ricevuto un ordine.')];
      case 'acqua': return [P(S.room === 'fondale' ? 'Ce n\'è moltissima. Tutta sopra di te.' : 'Sale con calma. Ha tempo, lei.')];
      case 'scafandro': return [P(S.f.indossato ? 'Ci sei dentro. Senti il tuo respiro, che non sapevi così rumoroso.' : 'Tela gommata, piombo nelle scarpe, un collare di rame. ' + (has('elmo') ? 'L\'elmo ce l\'hai tu.' : 'Manca l\'elmo.'))];
      case 'portello':
        if (S.room === 'fondale') { return [P('Un quadrato di luce gialla nella pancia della «Lampreda». Non è mai sembrata così accogliente.')]; }
        return [P(S.f.portello ? 'Aperto. Sotto, il fondo del mare.' : 'Ferro, guarnizioni di cuoio grasso, e un perno quadrato nudo. Senza manovella non si muove.')];
      case 'ganci': return [P('Sei ganci. Cinque vuoti.')];
      case 'scala': return [P('Ferro e ruggine. Regge.')];
      case 'relitto': return [IMG('relitto', 'Tav. VI — La «Malanotte»'), P('Non un\'alga, non un dente di cane. Il nome a poppa si legge ancora, in lettere dorate. Qualcuno, là dentro, ha acceso una luce.')];
      case 'impronte': return [P('Scarpe di piombo, passo regolare, nessuna esitazione. Sei uomini che sapevano dove andare. O che non lo decidevano più loro.')];
      case 'lampreda': return [P(S.room === 'fondale' ? 'Vista da fuori sembra un pesce che ha perso una discussione.' : 'Ci sei dentro, ed è il posto più sicuro nel raggio di centoquaranta braccia. Il che dice molto del resto.')];
      case 'fango': return [P('Grigio, fine, antico. Conserva tutto.')];
      case 'gente': return [P('Non c\'è nessuno. È questo il problema.')];
    }
    return [P('Niente di speciale.')];
  }

  function feed() {
    if (!has('gallette')) { return [P('Non hai niente che un polpo possa volere.')]; }
    if (S.room !== 'macchine' || dark()) { return [P('A chi?')]; }
    if (S.f.nutrito) { return [P('Ne ha già avuta una. Ti guarda come si guarda un cameriere lento, ma non insiste.')]; }
    S.f.nutrito = 1; S.loc.manovella = 'macchine'; S.moves++;
    return [P('Posi una galletta sul quadro. Un tentacolo la esamina, la porta sotto il mantello, e segue un rumore che preferiresti non aver sentito.'),
      P('Il polpo lascia cadere la [[manovella]] nell\'acqua, soddisfatto, e torna a fissare la paratia.')];
  }

  function wear() {
    if (S.room !== 'stagna') { return [P(has('elmo') ? 'In testa, senza il resto, serve solo a sentirti ridicolo.' : 'Qui non c\'è niente da indossare.')]; }
    if (S.f.indossato) { return [P('Ce l\'hai già addosso. Si sente.')]; }
    if (!has('elmo')) { return [P('Senza elmo è solo un vestito molto pesante in cui annegare con più dignità.')]; }
    S.f.indossato = 1; S.loc.elmo = 'worn'; S.moves++;
    return [P('Ti cali nello scafandro e avviti l\'elmo sul collare. Il mondo diventa tre vetri rotondi e il rumore del tuo respiro. Sa di rame e, vagamente, di gallette.')];
  }

  function crank() {
    if (S.room !== 'stagna') { return [P('Qui non c\'è niente a cui avvitarla.')]; }
    if (S.f.portello) { return [P('Il portello è già aperto.')]; }
    if (!has('manovella')) { return [P('Senza manovella il perno non gira. Ci provi con le dita, per scrupolo.')]; }
    if (!S.f.indossato) { return [P('Innesti la manovella sul perno, poi ti fermi. Aprire quel portello vestito così sarebbe una decisione breve.')]; }
    S.f.portello = 1; S.loc.manovella = 'perno'; S.moves++;
    return [P('Giri. L\'acqua entra dal basso, nera e ordinata: alle ginocchia, al petto, sopra l\'elmo. Poi il portello si spalanca sul fondo del mare: [[fuori]].')];
  }

  function act(verb, id) {
    switch (verb) {
      case 'esamina': S.moves++; return examine(id);
      case 'leggi':
        if (id === 'giornale' || id === 'scritta' || id === 'taccuino') { return verb === 'leggi' && id !== 'giornale' ? (S.moves++, examine(id)) : readLog(); }
        return [P('Non c\'è niente da leggere.')];
      case 'prendi':
        if (isItem(id)) {
          if (has(id)) { return [P('Ce l\'hai già.')]; }
          if (id === 'elmo' && S.loc.elmo === 'worn') { return [P('Ce l\'hai in testa.')]; }
          if (id === 'manovella' && S.loc.manovella === 'polpo') { return [P('Tiri. Il polpo tira. Lui ha otto braccia, tu due e una reputazione da difendere solo con te stesso. Lasci perdere.')]; }
          if (id === 'manovella' && S.loc.manovella === 'perno') { return [P('Meglio lasciarla dov\'è.')]; }
          S.loc[id] = 'inv'; S.moves++;
          if (id === 'lume') { return [P('Lo sganci dalla parete. La fiamma si piega, poi decide di restare.')]; }
          if (id === 'gallette') { return [P('Te ne riempi una tasca. Tintinnano.')]; }
          if (id === 'elmo') { return [P(S.loc.gallette === 'ponte' ? 'Rovesci le gallette sul tavolo e prendi l\'elmo. Pesa come un secchio pieno.' : 'Prendi l\'elmo. Pesa come un secchio pieno.')]; }
          if (id === 'manovella') { return [P('La ripeschi dall\'acqua. Il polpo non si volta nemmeno.')]; }
          return [P('Preso.')];
        }
        if (id === 'polpo') { return [P('No.')]; }
        if (id === 'scafandro') { return [P('Pesa quaranta chili. Non si prende: si indossa.')]; }
        if (id === 'giornale') { return [P('Meglio lasciarlo dov\'è. Se qualcuno torna, vorrà sapere com\'è finita.')]; }
        return [P('Non ti serve, e comunque non si stacca.')];
      case 'lascia': return [P('Non è il momento di alleggerirsi.')];
      case 'apri':
        if (id === 'botola' && S.room === 'cuccetta') {
          if (S.f.botola) { return [P('È già aperto.')]; }
          return [P('Tiri l\'anello con due mani. Niente: è incastrato. Servirebbe qualcosa di sottile e robusto da infilare nella fessura.')];
        }
        if (id === 'botola') { return [P('È già aperta: basta scendere.')]; }
        if (id === 'portello') { return crank(); }
        if (id === 'giornale') { return readLog(); }
        return [P('Non si apre.')];
      case 'chiudi': return [P('Non serve.')];
      case 'usa':
        if (isItem(id) && !has(id) && !(id === 'elmo' && S.loc.elmo === 'worn')) { return [P('Prima dovresti averlo in mano.')]; }
        if (id === 'bulino') {
          if (S.room === 'cuccetta' && !S.f.botola) {
            S.f.botola = 1; S.f.spuntato = 1; S.moves++;
            return [P('Infili il bulino nella fessura e fai leva con tutto il peso. Qualcosa cede: prima la punta del bulino, poi lo sportello. Mastro Zeno ti ucciderebbe, ma è un problema da superficie.'), P('Si scende: [[giù]].')];
          }
          if (S.room === 'macchine' && !dark()) { return [P('Minacciare un polpo con un bulino' + (S.f.spuntato ? ' spuntato' : '') + '. No.')]; }
          return [P('Non c\'è niente da incidere, e non è il momento.')];
        }
        if (id === 'lume') { return [P('È già acceso. È l\'unica cosa che funziona, qui.')]; }
        if (id === 'taccuino') { return [P('Fai uno schizzo veloce. Se non altro, ti pagano a tavola.')]; }
        if (id === 'gallette') { return (S.room === 'macchine' && !dark()) ? feed() : act('mangia', 'gallette'); }
        if (id === 'elmo' || id === 'scafandro') { return wear(); }
        if (id === 'manovella' || id === 'portello') { return crank(); }
        if (id === 'botola') { return act('apri', 'botola'); }
        if (id === 'timone') { return [P('Lo giri tutto da una parte. La «Lampreda» non se ne accorge.')]; }
        if (id === 'giornale') { return readLog(); }
        if (id === 'polpo') { return [P('E come, esattamente?')]; }
        if (id === 'scala') { return [P('Basta dire SU o GIÙ.')]; }
        return [P('Non sai bene come.')];
      case 'dai':
        if (id === 'gallette' || id === 'polpo') { return feed(); }
        if (S.room === 'macchine' && !dark() && isItem(id) && has(id)) { return [P('Il polpo lo esamina con un tentacolo e te lo restituisce. Aveva in mente altro.')]; }
        return [P('A chi?')];
      case 'parla':
        if (id === 'polpo') { return [P('«Buonasera», dici. Il polpo cambia colore, lentamente, dal ruggine al grigio tempesta. Non è un no. Non è nemmeno un sì.')]; }
        return [P('Dici «C\'è nessuno?» abbastanza forte da pentirtene. Non risponde nessuno. Meglio così.')];
      case 'indossa': return (id === 'elmo' || id === 'scafandro') ? wear() : [P('Non è cosa che si indossi.')];
      case 'togli':
        if (id !== 'elmo' && id !== 'scafandro') { return [P('Non ce l\'hai addosso.')]; }
        if (!S.f.indossato) { return [P('Non ce l\'hai addosso.')]; }
        if (S.f.portello) { return [P('Qui? Adesso? No.')]; }
        S.f.indossato = 0; S.loc.elmo = 'inv';
        return [P('Sviti l\'elmo ed esci dallo scafandro. L\'aria della «Lampreda» sa di chiuso, ed è buonissima.')];
      case 'accendi': return [P(id === 'lume' ? 'È già acceso.' : 'Non è cosa che si accenda.')];
      case 'spegni': return [P(id === 'lume' ? 'A centoquaranta braccia di profondità? No.' : 'Non è acceso.')];
      case 'mangia':
        if (id === 'gallette' && has('gallette')) { return [P('Ne assaggi un angolo. Cominci a capire perché l\'equipaggio è uscito.')]; }
        return [P('Non hai fame. Non così.')];
    }
    return [P('Non succede niente.')];
  }

  var HELP = 'COMANDI\nMuoversi: PRUA, POPPA, SU, GIÙ, DENTRO, FUORI\nGuardare: GUARDA, ESAMINA cosa, LEGGI cosa\nAgire: PRENDI, APRI, USA, DAI, PARLA, INDOSSA cosa\nLibro: SCHEDA (chi sei), MAPPA, INVENTARIO, PROLOGO, RICOMINCIA\nBastano verbo e oggetto: «prendi il lume», «dai le gallette al polpo».';

  function exec(input) {
    var s = norm(input);
    if (!s) { return [P('Come?')]; }
    var t = tokens(s), w = t[0], verb, ids = [], id, i, n;

    if (DIRS[w] && t.length === 1) { return done(go(DIRS[w])); }
    verb = VERBS[w];
    if (!verb) {
      if (NOUNS[w]) { verb = 'esamina'; t.unshift('esamina'); }
      else { return [P('Non conosco il verbo «' + w + '». Scrivi AIUTO per l\'elenco dei comandi.')]; }
    }

    if (verb === 'aiuto') { return [P(HELP)]; }
    if (verb === 'mappa') { return mapBlock(); }
    if (verb === 'scheda') { return sheet(); }
    if (verb === 'prologo') { return [{ t: 'prologue' }]; }
    if (verb === 'salva') { return [P('La partita si salva da sola a ogni mossa.')]; }
    if (verb === 'ricomincia') { S = fresh(); save(); return [{ t: 'restart' }]; }
    if (verb === 'aspetta') { S.moves++; return done([P('Aspetti. La «Lampreda» scricchiola, si assesta, scricchiola ancora. Non è un rumore che migliora con l\'attesa.')]); }
    if (verb === 'inventario') {
      var inv = inventory(), names = [];
      for (i = 0; i < inv.length; i++) { names.push(inv[i].label); }
      return [P(names.length ? 'Hai con te: ' + names.join(', ') + '.' : 'Non hai niente con te.')];
    }
    if (verb === 'vai') {
      for (i = 1; i < t.length; i++) { if (DIRS[t[i]]) { return done(go(DIRS[t[i]])); } }
      return [P('In che direzione? Qui si dice PRUA, POPPA, SU, GIÙ, DENTRO o FUORI.')];
    }
    if (verb === 'guarda' && t.length === 1) { S.moves++; return done(describe(true)); }
    if (verb === 'guarda') { verb = 'esamina'; }

      document.getElementById('pg-label').textContent = 'Pag. ' + (pos + 1) + ' di ' + turns.length;
      document.getElementById('pg-prev').disabled = pos === 0;
      document.getElementById('pg-next').disabled = pos === turns.length - 1;

      while (dir.firstChild) { dir.removeChild(dir.firstChild); }
      for (i = 0; i < ex.length; i++) { b = el('button', 'chip', DIR_LABEL[ex[i]]); b.type = 'button'; b.setAttribute('data-cmd', ex[i]); dir.appendChild(b); }
      dir.appendChild(el('span', 'spacer'));
      b = el('button', 'chip', 'GUARDA'); b.type = 'button'; b.setAttribute('data-cmd', 'guarda'); dir.appendChild(b);

      while (bag.firstChild) { bag.removeChild(bag.firstChild); }
      for (i = 0; i < inv.length; i++) { if (i) { bag.appendChild(el('span', 'sep', '·')); } bag.appendChild(kw(inv[i].label, inv[i].word)); }
      if (!inv.length) { bag.appendChild(document.createTextNode('niente')); }
    }

    function render() {
      var i, from, b;
      while (out.firstChild) { out.removeChild(out.firstChild); }
      if (prefs.mode === 'pagina') {
        out.appendChild(renderTurn(turns[pos]));
        if (pos < turns.length - 1) {
          b = el('button', 'chip go turn-next', 'Volta pagina ▶'); b.type = 'button'; b.id = 'turn-next';
          b.onclick = function () { goPage(pos + 1); };
          out.appendChild(b);
        }
        out.scrollTop = 0;
      } else {
        from = Math.max(0, turns.length - 30);
        for (i = from; i < turns.length; i++) { out.appendChild(renderTurn(turns[i])); }
        out.scrollTop = atTop ? 0 : out.scrollHeight;
      }
      renderPanel();
    }

    function goPage(n) { pos = Math.max(0, Math.min(turns.length - 1, n)); render(); }

    function pushPrologue() {
      var pages = PC.prologue(), i, first = turns.length;
      for (i = 0; i < pages.length; i++) { turns.push({ cmd: null, blocks: pages[i], kind: 'tavola' }); }
      return first;
    }

    function begin(forceNew) {
      var st = PC.start(forceNew);
      turns = []; pos = 0; atTop = true;
      if (!st.resumed) { pushPrologue(); }
      turns.push({ cmd: null, blocks: st.blocks, kind: 'turno' });
      if (st.resumed) { pos = turns.length - 1; atTop = false; }
      render();
    }

    function setPending(verb) {
      var chips = document.getElementById('chips-verb').getElementsByTagName('button'), i;
      pending = verb;
      for (i = 0; i < chips.length; i++) { chips[i].className = chips[i].getAttribute('data-verb') === verb ? 'chip on' : 'chip'; }
      input.value = verb ? verb + ' ' : '';
      input.placeholder = verb ? 'ora tocca una parola sottolineata' : 'scrivi un comando, poi Invio';
    }

    function run(cmd) {
      var blocks, first;
      cmd = String(cmd).replace(/^\s+|\s+$/g, '');
      if (!cmd) { return; }
      blocks = PC.exec(cmd);
      setPending(null);
      if (blocks.length && blocks[0].t === 'restart') { begin(true); return; }
      atTop = false;
      if (blocks.length && blocks[0].t === 'prologue') {
        first = pushPrologue();
        turns.push({ cmd: null, blocks: PC.look(), kind: 'turno' });
        pos = prefs.mode === 'pagina' ? first : turns.length - 1;
      } else {
        turns.push({ cmd: cmd, blocks: blocks, kind: 'turno' });
        pos = turns.length - 1;
      }
      while (turns.length > 60) { turns.shift(); pos--; }
      render();
    }

    function tapWord(w) {
      if (PC.isDir(w)) { run(w); }
      else if (pending) { run(pending + ' ' + w); }
      else { run('esamina ' + w); }
    }

    screen.onclick = function (ev) {
      var t = ev.target, cmd, verb;
      if (!t || !t.getAttribute) { return; }
      if (t.className === 'kw') { tapWord(t.getAttribute('data-kw')); return; }
      cmd = t.getAttribute('data-cmd'); verb = t.getAttribute('data-verb');
      if (cmd) { run(cmd); }
      else if (verb) { setPending(pending === verb ? null : verb); }
    };
    screen.onkeydown = function (ev) {
      var t = ev.target;
      if (t && t.className === 'kw' && (ev.keyCode === 13 || ev.keyCode === 32)) { ev.preventDefault(); tapWord(t.getAttribute('data-kw')); }
    };
    document.getElementById('pg-prev').onclick = function () { goPage(pos - 1); };
    document.getElementById('pg-next').onclick = function () { goPage(pos + 1); };
    document.getElementById('cmd-form').onsubmit = function (ev) { ev.preventDefault(); run(input.value); };

    function setMode(mode) {
      prefs.mode = mode;
      try { localStorage.setItem('nerodiseppia.prefs', JSON.stringify(prefs)); } catch (e) { /* non indispensabile */ }
      syncSwitch(); render();
    }
    function syncSwitch() {
      document.getElementById('mode-pagina').setAttribute('aria-pressed', prefs.mode === 'pagina' ? 'true' : 'false');
      document.getElementById('mode-rullo').setAttribute('aria-pressed', prefs.mode === 'rullo' ? 'true' : 'false');
    }
    document.getElementById('mode-pagina').onclick = function () { setMode('pagina'); };
    document.getElementById('mode-rullo').onclick = function () { setMode('rullo'); };

    var resizeTimer = null, lastW = 0;
    window.onresize = function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { if (out.clientWidth !== lastW) { lastW = out.clientWidth; render(); } }, 250);
    };

    syncSwitch();
    begin(false);
    lastW = out.clientWidth;
    /* la mappa usa i font web: se arrivano dopo, basta ridisegnare una volta */
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) { document.fonts.ready.then(function () { render(); }); }
  })();
}
</script>
</body>
</html>
